known_gaps:
  - Measurement foundation is partial rather than absent: GTM/Consent is published and validated; transport/dedup, canonical event taxonomy, conversion classification and GTM/GA4 governance ownership are accepted when the MNT-M2-05 revision is integrated; Meta ownership, full runtime implementation and end-to-end QA remain incomplete.
  - GTM Consent Mode state handling is proven for default denied, Green Continuar granted, Green Cancelar denied and persistence; site-wide third-party telemetry gating remains not fully proven.
  - GTM container GTM-PGCR4R47 is the project governance target and sole project-owned browser dispatcher; its Google account/user-access roster is not recorded in canonical project evidence.
  - GA4 governance owner is MoreNumTegra/Product Authority and target topology is one dedicated MoreNumTegra property with one production web stream for moretegra.com.br; exact GA4 property ID, stream ID and Measurement ID remain NOT_PROVEN and must not be invented.
  - Meta Pixel/Dataset ownership remains unproven/open under MNT-M2-06.
  - mnt_lead_success is the sole project primary conversion, but a stable non-invasive Green Form 46 success signal is not yet canonically proven; runtime primary-conversion implementation remains blocked until that signal is proven.
  - Explicit secondary conversion semantics are limited to request_conditions, request_project_conditions, negotiate_scenario, schedule_visit and whatsapp_contact; project_interest, form_start and form_submit_attempt are non-conversions.
  - No monetary lead conversion value is defined; property/offer prices must not be reused as conversion value.
  - Runtime event implementation remains MNT-M2-09 and end-to-end Measurement QA remains MNT-M2-10.
  - Search technical residuals remain for static canonical capability, sitemap availability and www HTTP redirect semantics.
  - GSC evidence volume at the 2026-09-10 T0 baseline is insufficient for statistically meaningful trend claims.
  - Deferred RESF modules require explicit later adoption/reconciliation before they govern implementation work.
