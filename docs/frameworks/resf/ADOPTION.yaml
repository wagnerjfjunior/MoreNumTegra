  - Current Measurement is operational and canonically evidenced: GTM container GTM-PGCR4R47 is live; GA4 property 553742649, stream 15759638334 and Measurement ID G-57M2XR0CY2 are proven; project source mnt_lead_success maps to GA4 generate_lead.
  - GTM Consent Mode state handling is proven for default denied and explicit granted/denied transitions; no later RESF adoption update waives destination-specific consent or advertising-personalization controls.
  - GTM container GTM-PGCR4R47 remains the project governance target and sole project-owned browser dispatcher; its Google account/user-access roster is not recorded in canonical project evidence.
  - MNT-M5-07 is complete with GTM Version 12 live; generate_lead receives controlled project_name and offer_name business metadata while visitor name, email, phone and raw/free-form texto-livre remain excluded from Measurement.
  - Explicit secondary conversion semantics remain limited to request_conditions, request_project_conditions, negotiate_scenario, schedule_visit and whatsapp_contact; project_interest, form_start and form_submit_attempt are non-conversions.
  - No monetary lead conversion value is defined; property/offer prices must not be reused as conversion value.
