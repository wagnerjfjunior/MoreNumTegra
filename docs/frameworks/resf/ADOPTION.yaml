  - Audience readiness does not equal audience creation, membership, activation or acquisition attribution. Paid media remains frozen and GA4 audience accumulation does not authorize Google Ads campaign creation, remarketing spend, Customer Match, CRM/PII upload or consent bypass.
  - Meta Measurement remains separately governed; exact Meta Dataset/Pixel/browser-source identifiers and their relationship are not proven here, and Meta CAPI remains optional/future without separate authorization.
