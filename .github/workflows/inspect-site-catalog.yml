name: Inspect Site Catalog
on:
  push:
    branches:
      - data/site-prices-august-2026
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build inspection bundle
        run: |
          mkdir -p out
          cp -R src-greenn out/
          python - <<'PY'
          import re, pathlib, json
          text = pathlib.Path('src-greenn/moretegra.js').read_text(encoding='utf-8')
          names = re.findall(r'name:\s*"([^"]+)"', text)
          pathlib.Path('out/catalog-names.json').write_text(json.dumps(names, ensure_ascii=False, indent=2), encoding='utf-8')
          print('PROJECT COUNT:', len(names))
          for n in names: print(n)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: site-catalog-inspection
          path: out
          if-no-files-found: error
