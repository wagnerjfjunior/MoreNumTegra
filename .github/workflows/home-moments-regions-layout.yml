name: Home moments and regions layout
on:
  pull_request:
    paths:
      - 'src-greenn/preview/index.html'
      - 'src-greenn/moretegra.css'
      - 'scripts/validate-home-moments-regions-layout.mjs'
      - '.github/workflows/home-moments-regions-layout.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-home-moments-regions-layout.mjs
