name: MNT M2-09 assemble Green JS

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  assemble:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Assemble single Green release artifact
        run: node scripts/build-moretegra-release.mjs

      - name: Verify measurement boundary
        env:
          MNT_UI_BASE_REF: 0ab0de22e2d69bff4b127c2db7f24a1744ea5187
        run: node scripts/verify-moretegra-release.mjs

      - name: Syntax check
        run: |
          node --check src-greenn/modules/moretegra.measurement.js
          node --check src-greenn/moretegra.js

      - name: Commit deterministic assembly when needed
        shell: bash
        run: |
          if git diff --quiet -- src-greenn/moretegra.js; then
            echo "Release artifact already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-greenn/moretegra.js
          git commit -m "build: assemble MoreNumTegra Green JS"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
