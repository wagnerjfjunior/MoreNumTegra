name: Orbita commercial structured data parity
on:
  pull_request:
    paths:
      - 'src-greenn/empreendimentos/universo-tatuape-orbita/index.html'
      - 'scripts/validate-orbita-commercial-schema-parity.mjs'
      - '.github/workflows/orbita-commercial-schema-parity.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-orbita-commercial-schema-parity.mjs
