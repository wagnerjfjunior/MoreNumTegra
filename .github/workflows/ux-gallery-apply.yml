name: Apply UX interest gallery

on:
  push:
    branches:
      - ux/review-p1-p2-2026-08-26
    paths:
      - .github/workflows/ux-gallery-apply.yml

permissions:
  contents: write

jobs:
  apply-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/review-p1-p2-2026-08-26
          fetch-depth: 0

      - name: Apply gallery patch
        run: python .github/scripts/apply-ux-gallery.py

      - name: Validate JavaScript and gallery coverage
        run: |
          node --check src-greenn/moretegra.js
          test "$(grep -c 'const INTEREST_GALLERIES' src-greenn/moretegra.js)" -eq 1
          test "$(grep -c 'data-interest-gallery' src-greenn/moretegra.js)" -ge 2
          grep -q 'Caminhos da Lapa Elo Duo' src-greenn/moretegra.js
          grep -q 'Bueno Brandão 257' src-greenn/moretegra.js

      - name: Commit gallery implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-greenn/moretegra.js
          git diff --cached --quiet && exit 0
          git commit -m "ux: adicionar galeria sob intenção no bloco de interesse"
          git push origin HEAD:ux/review-p1-p2-2026-08-26
