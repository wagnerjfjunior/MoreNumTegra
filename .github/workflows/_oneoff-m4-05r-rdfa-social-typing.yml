name: One-off M4-05R RDFa social typing

on:
  push:
    branches:
      - fix/mnt-m4-05r-rdfa-social-typing
    paths:
      - '.github/workflows/_oneoff-m4-05r-rdfa-social-typing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mnt-m4-05r-rdfa-social-typing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded RDFa social metadata typing
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const files = [
            {
              path: 'src-greenn/preview/index.html',
              about: 'https://www.moretegra.com.br/#webpage',
              type: 'schema:CollectionPage'
            },
            {
              path: 'src-greenn/empreendimentos/capiitolo-piero-lissoni/index.html',
              about: 'https://www.moretegra.com.br/empreendimentos/capiitolo-piero-lissoni/#webpage',
              type: 'schema:WebPage'
            },
            {
              path: 'src-greenn/empreendimentos/caminhos-da-lapa-elo-duo/index.html',
              about: 'https://www.moretegra.com.br/empreendimentos/caminhos-da-lapa-elo-duo/#webpage',
              type: 'schema:WebPage'
            }
          ];

          const prefix = 'schema: https://schema.org/ og: https://ogp.me/ns# twitter: http://dev.twitter.com/docs/cards#';
          const twitterNames = ['card', 'title', 'description', 'image', 'image:alt'];

          for (const file of files) {
            let html = fs.readFileSync(file.path, 'utf8');
            const oldHead = '<head>';
            const newHead = `<head about="${file.about}" typeof="${file.type}" prefix="${prefix}">`;
            if (!html.includes(oldHead)) throw new Error(`${file.path}: plain <head> not found`);
            html = html.replace(oldHead, newHead);

            for (const suffix of twitterNames) {
              const needle = `<meta name="twitter:${suffix}"`;
              const replacement = `<meta name="twitter:${suffix}" property="twitter:${suffix}"`;
              if (!html.includes(needle)) throw new Error(`${file.path}: ${needle} not found`);
              html = html.replace(needle, replacement);
            }

            fs.writeFileSync(file.path, html);
          }

          const validatorPath = 'scripts/validate-m4-05r.mjs';
          let validator = fs.readFileSync(validatorPath, 'utf8');
          const anchor = "  const html = await readFile(page.file, 'utf8');\n";
          if (!validator.includes(anchor)) throw new Error('validator anchor not found');
          const guard = `${anchor}\n  const expectedPageType = page.name === 'home' ? 'schema:CollectionPage' : 'schema:WebPage';\n  const expectedHeadAbout = page.canonical + '#webpage';\n  const headTag = html.match(/<head\\b[^>]*>/i)?.[0] ?? '';\n  if (!headTag.includes(\`about=\"${'${expectedHeadAbout}'}\"\`) || !headTag.includes(\`typeof=\"${'${expectedPageType}'}\"\`) || !headTag.includes('schema: https://schema.org/') || !headTag.includes('og: https://ogp.me/ns#') || !headTag.includes('twitter: http://dev.twitter.com/docs/cards#')) fail(page.name, 'typed RDFa social metadata subject missing or inconsistent');\n  for (const twitterSuffix of ['card','title','description','image','image:alt']) {\n    if (!html.includes(\`name=\"twitter:${'${twitterSuffix}'}\" property=\"twitter:${'${twitterSuffix}'}\"\`)) fail(page.name, \`Twitter/X RDFa property binding missing: ${'${twitterSuffix}'}\`);\n  }\n`;
          validator = validator.replace(anchor, guard);
          fs.writeFileSync(validatorPath, validator);
          NODE

          node scripts/validate-m4-05r.mjs
          rm .github/workflows/_oneoff-m4-05r-rdfa-social-typing.yml
      - name: Commit exactly one runtime correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-greenn/preview/index.html \
                  src-greenn/empreendimentos/capiitolo-piero-lissoni/index.html \
                  src-greenn/empreendimentos/caminhos-da-lapa-elo-duo/index.html \
                  scripts/validate-m4-05r.mjs \
                  .github/workflows/_oneoff-m4-05r-rdfa-social-typing.yml
          git diff --cached --check
          git commit -m 'fix(metadata): type social RDFa page subject'
          git push origin HEAD:fix/mnt-m4-05r-rdfa-social-typing
