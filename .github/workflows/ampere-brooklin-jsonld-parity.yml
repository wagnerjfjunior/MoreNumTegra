name: Ampere Brooklin JSON-LD graph and factual offer
on:
  pull_request:
    paths:
      - 'src-greenn/empreendimentos/ampere-brooklin/index.html'
      - 'scripts/validate-ampere-brooklin-jsonld-parity.mjs'
      - '.github/workflows/ampere-brooklin-jsonld-parity.yml'
  workflow_dispatch:
jobs:
  jsonld-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-ampere-brooklin-jsonld-parity.mjs
