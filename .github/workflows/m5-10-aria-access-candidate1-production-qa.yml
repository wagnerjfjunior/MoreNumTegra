name: M5-10 Aria access hero candidate1 Production QA
on:
  push:
    branches:
      - "diag/m5-10-aria-hero-access-candidate1-prod-qa-20260922"
    paths:
      - ".github/diagnostics/m5-10-aria-access-candidate1-production-smoke.mjs"
      - ".github/diagnostics/m5-10-aria-access-candidate1-production-perf.mjs"
      - ".github/workflows/m5-10-aria-access-candidate1-production-qa.yml"
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install QA
        run: |
          npm install --no-save playwright@1.55.0 lighthouse@13.5.0
          npx playwright install --with-deps chromium
      - name: Production smoke
        run: node .github/diagnostics/m5-10-aria-access-candidate1-production-smoke.mjs
      - name: Production five-run Lighthouse
        run: node .github/diagnostics/m5-10-aria-access-candidate1-production-perf.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-10-aria-access-candidate1-prod-qa
          path: m5-10-aria-access-candidate1-prod-qa/
          if-no-files-found: warn
