name: MNT recursive WBS decomposition once

on:
  push:
    branches:
      - docs/full-wbs-recursive-decomposition

permissions:
  contents: write

jobs:
  decompose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/full-wbs-recursive-decomposition
          fetch-depth: 0

      - name: Generate recursive planning decomposition
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          TOTAL = 1240
          graph_path = Path('docs/sfjm/PROGRAM_TASK_GRAPH.json')
          graph = json.loads(graph_path.read_text(encoding='utf-8'))

          D = {
            'MNT-M2-09': [('01','Source instrumentation and event emission','6'),('02','GTM/GA4 destination configuration','6'),('03','Production runtime validation','4'),('04','Parameter hygiene and regression protection','4'),('05','Acceptance evidence and lifecycle closure','4')],
            'MNT-M2-10': [('01','End-to-end Measurement test plan and matrix','4'),('02','Granted/denied consent-path validation','4'),('03','Transport, canonical-host and dedup validation','4'),('04','Event-parameter, privacy and PII validation','4'),('05','Production GA4 delivery and observability proof','4'),('06','Evidence package and acceptance decision','4')],
            'MNT-M3-01': [('01','Demand-source inventory and research scope','6'),('02','Keyword and topic-cluster research','6'),('03','Geographic and local-demand analysis','4'),('04','Demand scoring and prioritization','4'),('05','Research synthesis and evidence registration','4')],
            'MNT-M3-02': [('01','GSC export and normalization','4'),('02','Query-family and intent classification','6'),('03','Landing-page and ownership-gap analysis','4'),('04','Baseline publication with provenance','2')],
            'MNT-M3-03': [('01','Representative SERP sampling','4'),('02','Competitor and result-type analysis','4'),('03','Intent and SERP-feature classification','4'),('04','Implications and opportunity register','4')],
            'MNT-M3-04': [('01','Authoritative product-source inventory','4'),('02','Fact-registry schema and provenance rules','4'),('03','Portfolio fact verification and normalization','8'),('04','Claim approval and usage rules','4'),('05','Expiry, residual and revalidation rules','4')],
            'MNT-M3-05': [('01','Search-intent taxonomy','6'),('02','Query ownership rules','6'),('03','Cannibalization and conflict rules','4'),('04','Conversion-intent mapping','4'),('05','Contract review and publication','4')],
            'MNT-M3-06': [('01','Canonical query-family inventory','4'),('02','Query-family to page-owner mapping','8'),('03','Orphan and ownership-conflict review','4'),('04','Internal path and discoverability alignment','4'),('05','Map validation and publication','4')],
            'MNT-M3-07': [('01','Baseline source selection','4'),('02','KPI definitions and formulas','4'),('03','Targets, thresholds and success criteria','4'),('04','Measurement cadence and reporting contract','4')],
            'MNT-M4-01': [('01','Current information-architecture inventory','4'),('02','Target hierarchy and navigation model','8'),('03','Discovery and browse-path design','4'),('04','URL and route conventions','4'),('05','IA validation and acceptance','4')],
            'MNT-M4-02': [('01','Page-type inventory and ownership','6'),('02','Required fields and content contract','6'),('03','Intent, CTA and conversion contract per page type','4'),('04','Metadata and schema hooks','4'),('05','Page-contract acceptance','4')],
            'MNT-M4-03': [('01','Decision-question and objection inventory','4'),('02','Content-module architecture','8'),('03','Proof, facts and claim integration','4'),('04','FAQ and decision-support architecture','4'),('05','Editorial acceptance criteria','4')],
            'MNT-M4-04': [('01','Entity inventory','4'),('02','Entity relationship graph','6'),('03','Schema-type and property contract','6'),('04','Validation and consistency rules','4'),('05','Schema governance and publication','4')],
            'MNT-M4-05': [('01','Generate factual JSON-LD from governed facts','6'),('02','Validate syntax, entities and claims','4'),('03','Bounded implementation','4'),('04','Post-implementation structured-data proof','2')],
            'MNT-M4-06': [('01','Answerability and AI-discoverability audit','6'),('02','Entity and retrieval-gap analysis','6'),('03','Citation and source-readiness improvements','4'),('04','Factual answer-block design','4'),('05','GEO/AEO validation','4')],
            'MNT-M4-07': [('01','Internal-linking principles','4'),('02','Anchor-text taxonomy','4'),('03','Priority link graph','4'),('04','Link QA and acceptance','4')],
            'MNT-M4-08': [('01','Prioritized implementation plan','4'),('02','Content implementation','12'),('03','IA and internal-linking implementation','8'),('04','Schema and metadata integration hooks','4'),('05','Regression and acceptance','4')],
            'MNT-M4-09': [('01','Platform-capability assessment','4'),('02','Sitemap remediation path','6'),('03','www redirect remediation path','6'),('04','Canonical remediation path','4'),('05','Indexability validation','4')],
            'MNT-M5-01': [('01','Critical mobile-journey audit','4'),('02','Accessibility audit','4'),('03','Touch, navigation and control audit','4'),('04','Issue prioritization and acceptance criteria','4')],
            'MNT-M5-02': [('01','Lab and field baseline capture','4'),('02','LCP component analysis','4'),('03','INP interaction analysis','4'),('04','CLS and network-cost analysis','2'),('05','Performance baseline publication','2')],
            'MNT-M5-03': [('01','Media and asset inventory','4'),('02','Responsive-image strategy','4'),('03','Video loading and fallback strategy','4'),('04','Lazy-loading and below-fold policy','2'),('05','Media-performance acceptance criteria','2')],
            'MNT-M5-04': [('01','Filter and stage-control regression','4'),('02','Touch selector and control regression','4'),('03','Search and reset regression','4'),('04','Cross-device regression matrix','4')],
            'MNT-M5-05': [('01','Current funnel and intent map','4'),('02','Conversion-role alignment','4'),('03','Friction and abandonment analysis','4'),('04','Target conversion architecture','4')],
            'MNT-M5-06': [('01','CTA inventory and hierarchy','4'),('02','Form-journey analysis','4'),('03','Copy, placement and transition design','4'),('04','Optimization test plan','4')],
            'MNT-M5-07': [('01','Lead-signal taxonomy','4'),('02','Valid-lead definition','4'),('03','False-positive and duplicate controls','4'),('04','Lead-validity contract publication','4')],
            'MNT-M5-08': [('01','Form 46 lifecycle mapping','4'),('02','Field, consent and submission boundaries','4'),('03','CRM handoff evidence and ownership','4'),('04','Failure, retry and exception contract','4')],
            'MNT-M5-09': [('01','Happy-path conversion QA','4'),('02','Validation, error and network-failure QA','4'),('03','Mobile form/CTA QA','4'),('04','Measurement-to-lead correlation QA','4')],
            'MNT-M5-10': [('01','Performance-remediation prioritization','4'),('02','Authorized remediation implementation','12'),('03','Functional regression after remediation','4'),('04','Post-change performance evidence','4')],
            'MNT-M6-01': [('01','Identifier inventory and boundaries','4'),('02','Source and platform ownership boundaries','4'),('03','Attribution principles and windows','4'),('04','Privacy, consent and dedup boundaries','4')],
            'MNT-M6-03': [('01','Ads conversion selection and semantics','4'),('02','GA4/Google Ads linking boundaries','4'),('03','Import versus tag strategy','4'),('04','Architecture validation and acceptance','4')],
            'MNT-M6-04': [('01','Campaign and search-intent map','6'),('02','Keyword/query group design','6'),('03','Negative, brand and conflict policy','4'),('04','Ad-to-landing alignment','4'),('05','SEM governance contract','4')],
            'MNT-M6-05': [('01','Landing-page inventory','4'),('02','Query-to-landing mapping','6'),('03','Mismatch and cannibalization QA','4'),('04','Mapping publication','2')],
            'MNT-M6-07': [('01','External-platform preflight','4'),('02','Authorized platform configuration','8'),('03','Tag/conversion integration','4'),('04','Consent and platform QA','4'),('05','Implementation evidence package','4')],
            'MNT-M6-08': [('01','Click-ID and UTM propagation QA','4'),('02','Conversion firing QA','4'),('03','Dedup and attribution QA','4'),('04','Paid reporting QA','4')],
            'MNT-M7-01': [('01','Preview build and environment verification','4'),('02','Functional smoke','4'),('03','Mobile preview validation','4'),('04','Preview evidence package','4')],
            'MNT-M7-02': [('01','Technical QA','4'),('02','SEO and schema QA','4'),('03','Content and fact QA','4'),('04','Accessibility QA','2'),('05','Release-adjudication inputs','2')],
            'MNT-M7-03': [('01','Independent device/browser matrix','4'),('02','Navigation and filter QA','4'),('03','CTA and form QA','4'),('04','Media and performance QA','4')],
            'MNT-M7-04': [('01','Source-to-GTM QA','4'),('02','GTM-to-GA4 QA','4'),('03','Lead-signal and conversion QA','4'),('04','Consent and dedup QA','4')],
            'MNT-M7-05': [('01','Regression-suite definition','4'),('02','UI and interaction regression','4'),('03','Search/SEO regression','4'),('04','Measurement and form regression','4')],
            'MNT-M7-10': [('01','Immediate post-release telemetry','4'),('02','Core Web Vitals observation','4'),('03','Conversion-funnel observation','4'),('04','Runtime error observation','4'),('05','Baseline comparison','4'),('06','Findings registration','4')],
            'MNT-M7-11': [('01','Observation-window contract','4'),('02','Search Console observation','6'),('03','GA4 observation','6'),('04','Ads observation when active','4'),('05','Cross-channel synthesis','4')],
            'MNT-M7-12': [('01','Evidence bundle assembly','4'),('02','Provenance and timestamp validation','4'),('03','Status and lessons-learned registration','4'),('04','Canonical publication','4')],
            'MNT-M7-13': [('01','Provider evidence intake','4'),('02','Framework-change relevance review','4'),('03','Consumer adoption/defer/reject decision','4'),('04','Learning-loop publication','4')]
          }

          # Tasks intentionally atomic: completed historical work and compact 8h governance/release gates.
          ATOMIC = {
            'MNT-M0-01','MNT-M0-02','MNT-M0-03','MNT-M0-04','MNT-M0-05','MNT-M0-06','MNT-M0-07','MNT-M0-08','MNT-M0-09',
            'MNT-M1-01','MNT-M1-02','MNT-M1-03','MNT-M1-04','MNT-M1-05','MNT-M1-06','MNT-M1-07','MNT-M1-08',
            'MNT-M2-01','MNT-M2-02','MNT-M2-03','MNT-M2-04','MNT-M2-05','MNT-M2-06','MNT-M2-07','MNT-M2-08',
            'MNT-M6-02','MNT-M6-06','MNT-M7-06','MNT-M7-07','MNT-M7-08','MNT-M7-09'
          }

          def pct(n, d):
              return round((n / d) * 100, 4) if d else 0.0

          milestones = graph.get('milestones', [])
          task_count = 0
          subtask_count = 0
          decomposed_count = 0
          atomic_count = 0

          for phase in milestones:
              phase_hours = int(phase['hours'])
              phase['program_weight_percent'] = pct(phase_hours, TOTAL)
              phase['accepted_percent'] = pct(int(phase.get('accepted_hours', 0)), phase_hours)
              for task in phase.get('tasks', []):
                  task_count += 1
                  tid = task['id']
                  hours = int(task['hours'])
                  task['phase_weight_percent'] = pct(hours, phase_hours)
                  task['program_weight_percent'] = pct(hours, TOTAL)
                  task['accepted_percent'] = pct(int(task.get('accepted_hours', 0)), hours)
                  if tid in D:
                      children = []
                      subtotal = 0
                      for suffix, label, sh in D[tid]:
                          h = int(sh)
                          subtotal += h
                          cid = f'{tid}-{suffix}'
                          children.append({
                              'id': cid,
                              'label': label,
                              'state': 'PLANNED',
                              'hours': h,
                              'accepted_hours': 0,
                              'effort_class': task.get('effort_class', 'CONSUMER_PLANNING_ESTIMATE'),
                              'parent_weight_percent': pct(h, hours),
                              'phase_weight_percent': pct(h, phase_hours),
                              'program_weight_percent': pct(h, TOTAL),
                              'accepted_percent': 0.0,
                              'planning_semantics': 'DECOMPOSITION_DOES_NOT_AUTHORIZE_EXECUTION'
                          })
                      if subtotal != hours:
                          raise SystemExit(f'{tid}: child hours {subtotal} != parent hours {hours}')
                      task['decomposition'] = 'DECOMPOSED'
                      task['children'] = children
                      decomposed_count += 1
                      subtask_count += len(children)
                  else:
                      if tid not in ATOMIC:
                          raise SystemExit(f'{tid}: neither decomposed nor explicitly atomic')
                      task['decomposition'] = 'ATOMIC_NO_FURTHER_DECOMPOSITION_PLANNED'
                      task.pop('children', None)
                      atomic_count += 1

          if sum(int(p['hours']) for p in milestones) != TOTAL:
              raise SystemExit('phase total does not equal 1240h')
          if task_count != 74:
              raise SystemExit(f'expected 74 tasks, found {task_count}')

          graph['decomposition_contract'] = {
              'version': 'MNT_WBS_RECURSIVE_V1',
              'planning_baseline_date': '2026-09-11',
              'program_hours': TOTAL,
              'task_count': task_count,
              'decomposed_task_count': decomposed_count,
              'atomic_task_count': atomic_count,
              'subtask_count': subtask_count,
              'recursive_children_field': 'children',
              'atomic_rule': 'Do not create children when additional decomposition would not improve execution visibility or would retrospectively invent accepted historical detail.',
              'rollup_rule': 'Parent hours equal sum of immediate children when decomposed; never double-count parent plus descendants.',
              'percent_rule': 'program_weight_percent is hours/1240; phase_weight_percent is node hours/phase hours; parent_weight_percent is child hours/parent hours; accepted_percent is accepted_hours/node_hours.',
              'authorization_rule': 'PLANNED WBS != AUTHORIZED EXECUTION. Child planning nodes inherit project governance and require the applicable Product Authority gate.'
          }

          graph_path.write_text(json.dumps(graph, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          lines = []
          lines += ['# MNT-RESF — Recursive WBS Decomposition v1', '',
                    '> Structural planning decomposition for SFJM/dashboard consumption. This document does not change lifecycle authority or authorize execution.', '',
                    f'- Program forecast: **{TOTAL}h**',
                    f'- Canonical tasks: **{task_count}**',
                    f'- Tasks recursively decomposed: **{decomposed_count}**',
                    f'- Tasks intentionally atomic: **{atomic_count}**',
                    f'- Planning subtasks added: **{subtask_count}**',
                    '- Percentages are planning weights, not timesheet completion.',
                    '- Current lifecycle/progress remains owned by `docs/sfjm/CURRENT_PROGRAM_STATE.json`.',
                    '- Structural hierarchy/hours are consumed from `docs/sfjm/PROGRAM_TASK_GRAPH.json`.', '',
                    '## Rollup rules', '',
                    '- decomposed parent hours = sum of immediate child hours;',
                    '- parent and descendants are never summed together;',
                    '- `program_weight_percent = node_hours / 1240`;',
                    '- `phase_weight_percent = node_hours / phase_hours`;',
                    '- `parent_weight_percent = child_hours / parent_hours`;',
                    '- `accepted_percent = accepted_hours / node_hours`;',
                    '- planning/decomposition does not imply authorization.', '']

          for phase in milestones:
              ph = int(phase['hours'])
              lines += [f"## {phase['id']} — {phase['label']} — {ph}h — {phase['program_weight_percent']:.2f}% do programa", '']
              for task in phase.get('tasks', []):
                  marker = 'recursive' if task['decomposition'] == 'DECOMPOSED' else 'atomic'
                  lines += [f"### {task['id']} — {task['label']} — {task['hours']}h — {task['phase_weight_percent']:.2f}% da fase / {task['program_weight_percent']:.2f}% do programa — {marker}", '']
                  if task.get('children'):
                      lines += ['| Subtask | Entrega planejada | Horas | % tarefa | % fase | % programa |', '|---|---|---:|---:|---:|---:|']
                      for c in task['children']:
                          lines += [f"| {c['id']} | {c['label']} | {c['hours']} | {c['parent_weight_percent']:.2f}% | {c['phase_weight_percent']:.2f}% | {c['program_weight_percent']:.2f}% |"]
                      lines += ['']
                  else:
                      lines += ['Sem subtasks planejadas: unidade considerada suficientemente atômica para execução/visibilidade.', '']

          Path('docs/roadmap/MNT_RESF_WBS_RECURSIVE_DECOMPOSITION.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')

          contract_path = Path('docs/sfjm/PROGRAM_TASK_GRAPH.md')
          contract = contract_path.read_text(encoding='utf-8')
          appendix = '''\n\n## 9. Recursive WBS decomposition\n\nThe structural graph may contain recursive `children` arrays below a task when additional granularity materially improves execution visibility. Tasks that do not benefit from further decomposition are explicitly marked `ATOMIC_NO_FURTHER_DECOMPOSITION_PLANNED`.\n\nConsumer rendering rule:\n\n```text\nphase\n  -> task\n     -> child\n        -> child ... when present\n```\n\nThe dashboard should keep phase/task rows compact by default and expand descendants recursively on demand. Hours must roll up from immediate children without parent/descendant double counting. Planning weights are published at phase/task/subtask level for program, phase and parent contexts.\n\n`RECURSIVE WBS DETAIL != EXECUTION AUTHORIZATION`.\n\nHuman-readable detailed decomposition: `docs/roadmap/MNT_RESF_WBS_RECURSIVE_DECOMPOSITION.md`.\n'''
          if '## 9. Recursive WBS decomposition' not in contract:
              contract_path.write_text(contract.rstrip() + appendix, encoding='utf-8')

          print(json.dumps(graph['decomposition_contract'], indent=2))
          PY

      - name: Validate recursive rollups and JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('docs/sfjm/PROGRAM_TASK_GRAPH.json').read_text())
          assert sum(int(p['hours']) for p in g['milestones']) == 1240
          tasks=0; subs=0
          for p in g['milestones']:
              for t in p['tasks']:
                  tasks += 1
                  if t.get('children'):
                      assert sum(int(c['hours']) for c in t['children']) == int(t['hours']), t['id']
                      subs += len(t['children'])
                  assert 'program_weight_percent' in t
                  assert 'phase_weight_percent' in t
          assert tasks == 74
          assert subs == g['decomposition_contract']['subtask_count']
          print(f'PASS tasks={tasks} subtasks={subs} total=1240h')
          PY

      - name: Assert bounded documentation delta
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          allowed=$'docs/roadmap/MNT_RESF_WBS_RECURSIVE_DECOMPOSITION.md\ndocs/sfjm/PROGRAM_TASK_GRAPH.json\ndocs/sfjm/PROGRAM_TASK_GRAPH.md'
          test "$changed" = "$allowed"

      - name: Commit decomposition
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/MNT_RESF_WBS_RECURSIVE_DECOMPOSITION.md docs/sfjm/PROGRAM_TASK_GRAPH.json docs/sfjm/PROGRAM_TASK_GRAPH.md
          git commit -m "docs: add recursive WBS decomposition and weights"
          git push origin HEAD:docs/full-wbs-recursive-decomposition
