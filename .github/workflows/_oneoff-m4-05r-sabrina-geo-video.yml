name: One-off M4-05R Sabrina geo/video patch

on:
  push:
    branches:
      - fix/mnt-m4-05r-sabrina-geo-video

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mnt-m4-05r-sabrina-geo-video
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply approved M4-05R factual patch
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const HOME = 'src-greenn/preview/index.html';
          const CAPI = 'src-greenn/empreendimentos/capiitolo-piero-lissoni/index.html';
          const ELO = 'src-greenn/empreendimentos/caminhos-da-lapa-elo-duo/index.html';
          const VALIDATOR = 'scripts/validate-m4-05r.mjs';

          const SABRINA_ID = 'https://www.moretegra.com.br/#sabrina-da-tegra';
          const SABRINA_AGENT_ID = 'https://www.moretegra.com.br/#sabrina-real-estate-agent';
          const ESTANDE_ID = 'https://www.moretegra.com.br/#estande-caminhos-da-lapa';
          const PHOTO = 'https://s3-gdigital.s3.amazonaws.com/gdigital/313/sNzJJWhmmsjkZjUV7gCKTgrlzRINCD6yDIAvkZOJ.webp';
          const LOGO = 'https://s3-gdigital.s3.amazonaws.com/gdigital/313/Logo_Tegra_Amarelo%20666X375%20SemFundo.webp';
          const LAT = -23.517165527430233;
          const LNG = -46.71861778788628;
          const VIDEO_DATE = '2026-08-23T19:50:00Z';

          const read = (p) => fs.readFileSync(p, 'utf8');
          const write = (p, s) => fs.writeFileSync(p, s);

          function escapeRegExp(s) {
            return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          }

          function updateJsonLd(html, id, mutate) {
            const escaped = escapeRegExp(id);
            const re = new RegExp('(<script\\b[^>]*id=["\\\']' + escaped + '["\\\'][^>]*type=["\\\']application\\/ld\\+json["\\\'][^>]*>)([\\s\\S]*?)(<\\/script>)', 'i');
            const m = html.match(re);
            if (!m) throw new Error('JSON-LD script #' + id + ' missing');
            const data = JSON.parse(m[2]);
            mutate(data);
            const body = '\n  ' + JSON.stringify(data, null, 2).split('\n').join('\n  ') + '\n  ';
            return html.replace(re, m[1] + body + m[3]);
          }

          function walk(value, fn) {
            if (Array.isArray(value)) {
              value.forEach((item) => walk(item, fn));
              return;
            }
            if (!value || typeof value !== 'object') return;
            fn(value);
            Object.values(value).forEach((child) => walk(child, fn));
          }

          function geo() {
            return { '@type': 'GeoCoordinates', latitude: LAT, longitude: LNG };
          }

          function hardenGraph(data, label) {
            let place = 0;
            let agent = 0;
            let person = 0;
            walk(data, (node) => {
              const types = [].concat(node['@type'] || []);
              if (node['@id'] === ESTANDE_ID && types.includes('Place')) {
                node.geo = geo();
                place += 1;
              }
              if (node['@id'] === SABRINA_AGENT_ID && types.includes('RealEstateAgent')) {
                node.image = PHOTO;
                node.geo = geo();
                agent += 1;
              }
              if (node['@id'] === SABRINA_ID && types.includes('Person')) {
                node.image = PHOTO;
                person += 1;
              }
            });
            if (place !== 1 || agent !== 1 || person !== 1) {
              throw new Error(label + ': expected one Place/Agent/Person definition; got ' + place + '/' + agent + '/' + person);
            }
          }

          function replaceOnce(text, oldText, newText, label) {
            const count = text.split(oldText).length - 1;
            if (count !== 1) throw new Error(label + ': expected exactly one match, found ' + count);
            return text.replace(oldText, newText);
          }

          let home = read(HOME);
          let capi = read(CAPI);
          let elo = read(ELO);
          let validator = read(VALIDATOR);

          home = updateJsonLd(home, 'mt-search-schema', (data) => hardenGraph(data, 'home'));
          home = updateJsonLd(home, 'mt-localbusiness-schema', (data) => {
            if (data['@id'] !== SABRINA_AGENT_ID || ![].concat(data['@type'] || []).includes('RealEstateAgent')) {
              throw new Error('home standalone Sabrina RealEstateAgent mismatch');
            }
            data.image = PHOTO;
            data.geo = geo();
          });
          home = updateJsonLd(home, 'mt-home-video-schema', (data) => {
            if (data['@id'] !== 'https://www.moretegra.com.br/#campaign-video' || data['@type'] !== 'VideoObject') {
              throw new Error('home VideoObject mismatch');
            }
            data.uploadDate = VIDEO_DATE;
          });

          capi = updateJsonLd(capi, 'mnt-capiitolo-schema', (data) => hardenGraph(data, 'capiitolo'));
          elo = updateJsonLd(elo, 'mt-project-schema', (data) => hardenGraph(data, 'elo-duo'));

          validator = replaceOnce(
            validator,
            "const SABRINA_BUSINESS_IMAGE = 'https://s3-gdigital.s3.amazonaws.com/gdigital/313/Logo_Tegra_Amarelo%20666X375%20SemFundo.webp';",
            "const SABRINA_BUSINESS_IMAGE = '" + PHOTO + "';\nconst SABRINA_BUSINESS_LOGO = '" + LOGO + "';\nconst ESTANDE_ID = '" + ESTANDE_ID + "';\nconst ESTANDE_LATITUDE = " + LAT + ";\nconst ESTANDE_LONGITUDE = " + LNG + ";\nconst VIDEO_UPLOAD_DATE = '" + VIDEO_DATE + "';",
            'validator constants'
          );

          validator = replaceOnce(
            validator,
            "if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(video.uploadDate ?? '')) fail(page.name, 'homepage VideoObject uploadDate missing or invalid');",
            "if (video.uploadDate !== VIDEO_UPLOAD_DATE) fail(page.name, 'homepage VideoObject uploadDate must match verified UTC timestamp');",
            'validator video timestamp'
          );

          validator = replaceOnce(
            validator,
            "if (local.priceRange !== 'Consulte condições' || local.image !== SABRINA_BUSINESS_IMAGE || local.logo !== SABRINA_BUSINESS_IMAGE) fail(page.name, 'standalone LocalBusiness recommended fields mismatch');",
            "if (local.priceRange !== 'Consulte condições' || local.image !== SABRINA_BUSINESS_IMAGE || local.logo !== SABRINA_BUSINESS_LOGO) fail(page.name, 'standalone LocalBusiness recommended fields mismatch');\n        if (Number(local.geo?.latitude) !== ESTANDE_LATITUDE || Number(local.geo?.longitude) !== ESTANDE_LONGITUDE) fail(page.name, 'standalone LocalBusiness geo mismatch');",
            'validator standalone Sabrina fields'
          );

          validator = replaceOnce(
            validator,
            "if (sabrinaAgent.priceRange !== 'Consulte condições' || sabrinaAgent.logo !== SABRINA_BUSINESS_IMAGE || sabrinaAgent.image !== SABRINA_BUSINESS_IMAGE) fail(page.name, 'Sabrina RealEstateAgent recommended fields mismatch');",
            "if (sabrinaAgent.priceRange !== 'Consulte condições' || sabrinaAgent.logo !== SABRINA_BUSINESS_LOGO || sabrinaAgent.image !== SABRINA_BUSINESS_IMAGE) fail(page.name, 'Sabrina RealEstateAgent recommended fields mismatch');\n    if (Number(sabrinaAgent.geo?.latitude) !== ESTANDE_LATITUDE || Number(sabrinaAgent.geo?.longitude) !== ESTANDE_LONGITUDE) fail(page.name, 'Sabrina RealEstateAgent geo mismatch');",
            'validator Sabrina agent fields'
          );

          validator = replaceOnce(
            validator,
            "if (sabrina.identifier?.value !== SABRINA_CRECI) fail(page.name, 'Sabrina CRECI mismatch');",
            "if (sabrina.identifier?.value !== SABRINA_CRECI) fail(page.name, 'Sabrina CRECI mismatch');\n    if (sabrina.image !== SABRINA_BUSINESS_IMAGE) fail(page.name, 'Sabrina Person image mismatch');",
            'validator Sabrina Person image'
          );

          validator = replaceOnce(
            validator,
            "const phone = nodes.find((node) => node['@id'] === 'https://www.moretegra.com.br/#sabrina-contato' && node.telephone);",
            "const estande = typedNode(nodes, ESTANDE_ID, 'Place');\n  if (!estande) fail(page.name, 'Sabrina work Place missing');\n  else if (Number(estande.geo?.latitude) !== ESTANDE_LATITUDE || Number(estande.geo?.longitude) !== ESTANDE_LONGITUDE) fail(page.name, 'Sabrina work Place geo mismatch');\n\n  const phone = nodes.find((node) => node['@id'] === 'https://www.moretegra.com.br/#sabrina-contato' && node.telephone);",
            'validator work Place geo'
          );

          write(HOME, home);
          write(CAPI, capi);
          write(ELO, elo);
          write(VALIDATOR, validator);
          NODE

          node scripts/validate-m4-05r.mjs

      - name: Commit exactly one runtime change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_oneoff-m4-05r-sabrina-geo-video.yml
          git add src-greenn/preview/index.html \
                  src-greenn/empreendimentos/capiitolo-piero-lissoni/index.html \
                  src-greenn/empreendimentos/caminhos-da-lapa-elo-duo/index.html \
                  scripts/validate-m4-05r.mjs
          git commit -m "fix(schema): add Sabrina image, verified geo and video UTC"
          git push origin HEAD:fix/mnt-m4-05r-sabrina-geo-video
