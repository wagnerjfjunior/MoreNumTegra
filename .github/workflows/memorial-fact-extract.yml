name: memorial-fact-extract

on:
  push:
    branches:
      - audit/memoriais-fact-extraction

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: Extract memorial text
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p memorial-extraction/text
          printf 'filename\tsha256\tbytes\ttext_bytes\n' > memorial-extraction/manifest.tsv
          find Tegra/Memoriais_Descritivos -maxdepth 1 -type f -iname '*.pdf' -print0 | sort -z | while IFS= read -r -d '' pdf; do
            base="$(basename "$pdf" .pdf)"
            txt="memorial-extraction/text/${base}.txt"
            pdftotext -layout -enc UTF-8 "$pdf" "$txt" || true
            sha="$(sha256sum "$pdf" | awk '{print $1}')"
            bytes="$(stat -c '%s' "$pdf")"
            tbytes="$(stat -c '%s' "$txt" 2>/dev/null || echo 0)"
            printf '%s\t%s\t%s\t%s\n' "$(basename "$pdf")" "$sha" "$bytes" "$tbytes" >> memorial-extraction/manifest.tsv
          done
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          rows=[]
          area_re=re.compile(r'(?<!\d)(\d{1,3}(?:[\.,]\d{1,2})?)\s*m(?:²|2)\b', re.I)
          for p in sorted(Path('memorial-extraction/text').glob('*.txt')):
              text=p.read_text(encoding='utf-8', errors='ignore')
              areas=[]
              for x in area_re.findall(text):
                  try: v=float(x.replace(',','.'))
                  except: continue
                  if 10 <= v <= 1000: areas.append(v)
              rows.append({
                'source': p.name,
                'text_bytes': len(text.encode('utf-8')),
                'areas_m2_unique': sorted(set(areas)),
                'mentions': {
                  'gerador': bool(re.search(r'\bgerador', text, re.I)),
                  'ar_condicionado': bool(re.search(r'ar[- ]?condicionad', text, re.I)),
                  'bicicletario': bool(re.search(r'biciclet', text, re.I)),
                  'piscina': bool(re.search(r'piscina', text, re.I)),
                  'churrasqueira': bool(re.search(r'churrasqueir', text, re.I)),
                  'coworking': bool(re.search(r'cowork', text, re.I)),
                  'pet': bool(re.search(r'\bpet\b|pet place|pet care', text, re.I)),
                  'quadra': bool(re.search(r'quadra', text, re.I)),
                  'sauna': bool(re.search(r'sauna', text, re.I)),
                  'fitness': bool(re.search(r'fitness|academia', text, re.I)),
                }
              })
          Path('memorial-extraction/summary.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: memorial-extraction
          path: memorial-extraction/
          retention-days: 3
