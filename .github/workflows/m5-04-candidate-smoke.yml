name: M5-04 exact-head candidate smoke

on:
  push:
    branches:
      - "diag/m5-04-mobile-regression-20260920"
    paths:
      - ".github/workflows/m5-04-candidate-smoke.yml"
      - ".github/diagnostics/m5-04-candidate-smoke.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact runtime candidate
        uses: actions/checkout@v4
        with:
          ref: "a4fcec608ef038ab8ecd3671e4058db1f33b093b"
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "a4fcec608ef038ab8ecd3671e4058db1f33b093b"
      - name: Repository validators
        run: |
          node scripts/validate-commercial-page-standard.mjs
          node scripts/validate-m4-05r.mjs
          node scripts/validate-mobile-ui-standard.mjs
          node scripts/validate-favicon-standard.mjs
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/m5-04-server.log 2>&1 &
          echo $! > /tmp/m5-04-server.pid
          sleep 1
      - name: Run exact-head gallery smoke
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium, firefox, webkit } from "playwright";
          const url="http://127.0.0.1:4173/src-greenn/empreendimentos/aria-higienopolis/index.html";
          for (const [name,type] of Object.entries({chromium,firefox,webkit})) {
            const b=await type.launch({headless:true});
            const c=await b.newContext({viewport:{width:393,height:852},locale:"pt-BR",hasTouch:true});
            const p=await c.newPage();
            const r=await p.goto(url,{waitUntil:"domcontentloaded",timeout:30000});
            if(!r?.ok()) throw new Error(`${name}: HTTP ${r?.status()}`);
            await p.waitForSelector("[data-gallery-next]",{state:"attached",timeout:15000});
            const next=await p.locator("[data-gallery-next]").boundingBox();
            const prev=await p.locator("[data-gallery-prev]").boundingBox();
            if(!next||next.width<46||next.height<46) throw new Error(`${name}: next ${JSON.stringify(next)}`);
            if(!prev||prev.width<46||prev.height<46) throw new Error(`${name}: prev ${JSON.stringify(prev)}`);
            const before=(await p.locator("[data-gallery-count]").textContent())?.trim();
            await p.locator("[data-gallery-next]").tap();
            await p.waitForTimeout(150);
            const after=(await p.locator("[data-gallery-count]").textContent())?.trim();
            if(before===after) throw new Error(`${name}: gallery did not advance`);
            const overflow=await p.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1);
            if(overflow) throw new Error(`${name}: horizontal overflow`);
            console.log(JSON.stringify({browser:name,next,prev,before,after,overflow:false,result:"PASS"}));
            await c.close();
            await b.close();
          }
          NODE
