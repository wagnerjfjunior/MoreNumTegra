name: One-off M4-05R Google LocalBusiness eligibility

on:
  push:
    branches:
      - fix/mnt-m4-05r-google-localbusiness

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mnt-m4-05r-google-localbusiness
          fetch-depth: 0

      - name: Apply LocalBusiness patch
        run: python scripts/_oneoff_m4_05r_localbusiness.py

      - name: Run M4-05R validator
        run: node scripts/validate-m4-05r.mjs

      - name: Commit functional correction and remove one-off helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/_oneoff-m4-05r-localbusiness.yml scripts/_oneoff_m4_05r_localbusiness.py
          git add src-greenn/preview/index.html src-greenn/empreendimentos/capiitolo-piero-lissoni/index.html src-greenn/empreendimentos/caminhos-da-lapa-elo-duo/index.html scripts/validate-m4-05r.mjs .github/workflows/_oneoff-m4-05r-localbusiness.yml scripts/_oneoff_m4_05r_localbusiness.py
          git commit -m "feat(schema): add Google-eligible Sabrina RealEstateAgent entity"
          git push origin HEAD:fix/mnt-m4-05r-google-localbusiness
