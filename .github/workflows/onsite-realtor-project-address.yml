name: RealEstateAgent onsite location validation
on:
  pull_request:
    paths:
      - 'src-greenn/empreendimentos/**'
      - 'scripts/validate-onsite-realtor-project-address.mjs'
      - '.github/workflows/onsite-realtor-project-address.yml'
  workflow_dispatch:
jobs:
  onsite-address:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-onsite-realtor-project-address.mjs
