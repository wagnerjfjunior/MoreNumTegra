name: MNT M2-09 parameter hygiene once

on:
  push:
    branches:
      - feat/mnt-m2-09-tracking-implementation

permissions:
  contents: write

jobs:
  hygiene:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mnt-m2-09-tracking-implementation
          fetch-depth: 0

      - name: Apply bounded Measurement v4 parameter hygiene
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src-greenn/modules/moretegra.measurement.js')
          source = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              '// MNT-M2-09 measurement instrumentation v3.',
              '// MNT-M2-09 measurement instrumentation v4.',
              'version marker'
          )
          replace_once(
              'const BIND_MARKER = Symbol.for("morenumtegra.measurement.delegated.v3");',
              'const BIND_MARKER = Symbol.for("morenumtegra.measurement.delegated.v4");',
              'delegation marker'
          )
          replace_once(
              '  const SEARCH_LOCATION_INDEX = new Map();\n',
              '  const SEARCH_LOCATION_INDEX = new Map();\n  const NOT_APPLICABLE = "not_applicable";\n',
              'not-applicable constant'
          )
          replace_once(
              '  const ALLOWED_EVENT_PARAMETERS = Object.freeze({\n'
              '    mnt_page_view: new Set(["placement"]),\n'
              '    mnt_section_click: new Set(["section_target", "faq_item", "placement"]),\n'
              '    mnt_catalog_filter: new Set(["filter_dimension", "filter_value", "result_count", "placement"]),\n'
              '    mnt_catalog_search: new Set(["search_state", "search_location", "result_count", "placement"]),\n'
              '    mnt_intent: new Set(["intent_type", "contact_channel", "placement", "project_name", "offer_name"])\n'
              '  });\n',
              '  const ALLOWED_EVENT_PARAMETERS = Object.freeze({\n'
              '    mnt_page_view: new Set(["placement"]),\n'
              '    mnt_section_click: new Set(["section_target", "faq_item", "placement"]),\n'
              '    mnt_catalog_filter: new Set(["filter_dimension", "filter_value", "result_count", "placement"]),\n'
              '    mnt_catalog_search: new Set(["search_state", "search_location", "result_count", "placement"]),\n'
              '    mnt_intent: new Set(["intent_type", "contact_channel", "placement", "project_name", "offer_name"])\n'
              '  });\n\n'
              '  const EVENT_PARAMETER_DEFAULTS = Object.freeze({\n'
              '    mnt_section_click: Object.freeze({faq_item: NOT_APPLICABLE}),\n'
              '    mnt_catalog_search: Object.freeze({search_location: NOT_APPLICABLE}),\n'
              '    mnt_intent: Object.freeze({project_name: NOT_APPLICABLE, offer_name: NOT_APPLICABLE})\n'
              '  });\n',
              'event parameter defaults'
          )
          replace_once(
              '  function cleanParameters(eventName, parameters) {\n'
              '    const allowlist = ALLOWED_EVENT_PARAMETERS[eventName];\n'
              '    if (!allowlist) return {};\n\n'
              '    return Object.entries(parameters || {}).reduce((result, [key, value]) => {\n'
              '      if (!allowlist.has(key)) return result;\n'
              '      if (value === undefined || value === null || value === "") return result;\n'
              '      result[key] = value;\n'
              '      return result;\n'
              '    }, {});\n'
              '  }\n',
              '  function cleanParameters(eventName, parameters) {\n'
              '    const allowlist = ALLOWED_EVENT_PARAMETERS[eventName];\n'
              '    if (!allowlist) return {};\n\n'
              '    const defaults = EVENT_PARAMETER_DEFAULTS[eventName] || {};\n'
              '    const source = {...defaults};\n'
              '    Object.entries(parameters || {}).forEach(([key, value]) => {\n'
              '      if (value === undefined || value === null || value === "") return;\n'
              '      source[key] = value;\n'
              '    });\n\n'
              '    return Object.entries(source).reduce((result, [key, value]) => {\n'
              '      if (!allowlist.has(key)) return result;\n'
              '      result[key] = value;\n'
              '      return result;\n'
              '    }, {});\n'
              '  }\n',
              'parameter materialization'
          )

          path.write_text(source, encoding='utf-8')
          PY

      - name: Assemble Green release artifact
        run: node scripts/build-moretegra-release.mjs

      - name: Verify UI boundary and Measurement hygiene
        env:
          MNT_UI_BASE_REF: 0ab0de22e2d69bff4b127c2db7f24a1744ea5187
        run: node scripts/verify-moretegra-release.mjs

      - name: Syntax check
        run: |
          node --check src-greenn/modules/moretegra.measurement.js
          node --check src-greenn/moretegra.js

      - name: Assert bounded file delta
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'src-greenn/modules/moretegra.measurement.js\nsrc-greenn/moretegra.js'

      - name: Commit bounded hygiene patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-greenn/modules/moretegra.measurement.js src-greenn/moretegra.js
          git commit -m "fix: materialize optional measurement parameters"
          git push origin HEAD:feat/mnt-m2-09-tracking-implementation
