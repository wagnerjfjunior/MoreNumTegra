name: Blog Lapa Vila Anastacio urbanismo SEO
on:
  pull_request:
    paths:
      - 'src-greenn/blog/bairros-sao-paulo/lapa-vila-anastacio-como-escolher/index.html'
      - 'src-greenn/blog/mercado/valorizacao-imobiliaria-lapa-sao-paulo/index.html'
      - 'scripts/validate-blog-lapa-vila-anastacio.mjs'
      - '.github/workflows/blog-lapa-vila-anastacio.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-blog-lapa-vila-anastacio.mjs
