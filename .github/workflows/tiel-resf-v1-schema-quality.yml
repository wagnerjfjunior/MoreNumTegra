name: Tièl RESF V1 semantic quality gate
on:
  pull_request:
    paths:
      - 'src-greenn/empreendimentos/tiel-vila-nova-conceicao/index.html'
      - 'scripts/validate-tiel-resf-v1-schema-quality.mjs'
      - '.github/workflows/tiel-resf-v1-schema-quality.yml'
  workflow_dispatch:
jobs:
  schema-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-tiel-resf-v1-schema-quality.mjs
