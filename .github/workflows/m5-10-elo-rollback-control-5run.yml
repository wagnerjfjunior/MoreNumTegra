name: M5-10 Elo rollback control 5-run

on:
  push:
    branches:
      - "diag/m5-10-elo-rollback-control-5run-20260921"
    paths:
      - ".github/diagnostics/m5-10-elo-rollback-control-5run.mjs"
      - ".github/workflows/m5-10-elo-rollback-control-5run.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Lighthouse
        run: npm install --no-save lighthouse@13.5.0
      - name: Confirm Chrome
        run: google-chrome --version || chromium --version || chromium-browser --version
      - name: Run five Production control measurements
        run: node .github/diagnostics/m5-10-elo-rollback-control-5run.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-10-elo-rollback-control-5run
          path: m5-10-elo-rollback-control-5run/
          if-no-files-found: error
