name: One-off homepage VideoObject hardening

on:
  push:
    paths:
      - '.github/workflows/_oneoff-home-video-rich-result.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mnt-home-video-rich-result
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve verified YouTube metadata and patch homepage
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36' \
            'https://www.youtube.com/watch?v=SCCM3vzNlyk&hl=pt-BR' -o /tmp/youtube.html

          node <<'NODE'
          const fs = require('fs');
          const videoId = 'SCCM3vzNlyk';
          const watch = fs.readFileSync('/tmp/youtube.html','utf8');
          const homePath = 'src-greenn/preview/index.html';
          const validatorPath = 'scripts/validate-m4-05r.mjs';

          const pick = (...vals) => vals.find(v => v && String(v).trim()) || null;
          const rx = (text, re) => text.match(re)?.[1] || null;
          const decode = (s) => s ? s.replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>') : s;

          async function load(url) {
            const res = await fetch(url, {headers:{'user-agent':'Mozilla/5.0 Chrome/153'}});
            if (!res.ok) return '';
            return await res.text();
          }

          function dateFrom(text) {
            return pick(
              rx(text, /itemprop=["']uploadDate["'][^>]*content=["']([^"']+)["']/i),
              rx(text, /content=["']([^"']+)["'][^>]*itemprop=["']uploadDate["']/i),
              rx(text, /"uploadDate"\s*:\s*"([0-9]{4}-[0-9]{2}-[0-9]{2})"/),
              rx(text, /"publishDate"\s*:\s*"([0-9]{4}-[0-9]{2}-[0-9]{2})"/)
            );
          }

          (async () => {
            const embed = await load(`https://www.youtube.com/embed/${videoId}?hl=pt-BR`);
            const nocookie = await load(`https://www.youtube-nocookie.com/embed/${videoId}?hl=pt-BR`);
            const channelId = pick(
              rx(watch, /"channelId"\s*:\s*"(UC[^"]+)"/),
              rx(embed, /"channelId"\s*:\s*"(UC[^"]+)"/),
              rx(nocookie, /"channelId"\s*:\s*"(UC[^"]+)"/)
            );

            let feed = '';
            let entry = '';
            if (channelId) {
              feed = await load(`https://www.youtube.com/feeds/videos.xml?channel_id=${encodeURIComponent(channelId)}`);
              const entries = feed.match(/<entry>[\s\S]*?<\/entry>/g) || [];
              entry = entries.find(e => e.includes(`<yt:videoId>${videoId}</yt:videoId>`)) || '';
            }

            const feedPublished = entry ? rx(entry, /<published>([^<]+)<\/published>/i) : null;
            const uploadDateRaw = pick(dateFrom(watch), dateFrom(embed), dateFrom(nocookie), feedPublished);
            const uploadDate = uploadDateRaw ? uploadDateRaw.slice(0,10) : null;
            if (!uploadDate || !/^\d{4}-\d{2}-\d{2}$/.test(uploadDate)) {
              console.log(JSON.stringify({channelId, watchPublish:dateFrom(watch), embedPublish:dateFrom(embed), noCookiePublish:dateFrom(nocookie), feedEntryFound:Boolean(entry)}, null, 2));
              throw new Error('YouTube uploadDate/publishDate could not be verified; refusing runtime mutation');
            }

            const secondsRaw = pick(
              rx(watch, /"lengthSeconds"\s*:\s*"(\d+)"/),
              rx(embed, /"lengthSeconds"\s*:\s*"(\d+)"/),
              rx(nocookie, /"lengthSeconds"\s*:\s*"(\d+)"/),
              entry ? rx(entry, /<media:content[^>]+duration=["'](\d+)["']/i) : null
            );
            const seconds = secondsRaw ? Number(secondsRaw) : null;
            const duration = Number.isFinite(seconds) && seconds > 0 ? `PT${seconds}S` : null;

            const rawTitle = pick(
              entry ? rx(entry, /<media:title>([\s\S]*?)<\/media:title>/i) : null,
              rx(watch, /<meta[^>]+name=["']title["'][^>]+content=["']([^"']+)["']/i),
              rx(watch, /<meta[^>]+property=["']og:title["'][^>]+content=["']([^"']+)["']/i)
            );
            const rawDescription = pick(
              entry ? rx(entry, /<media:description>([\s\S]*?)<\/media:description>/i) : null,
              rx(watch, /<meta[^>]+name=["']description["'][^>]+content=["']([^"']+)["']/i),
              rx(watch, /<meta[^>]+property=["']og:description["'][^>]+content=["']([^"']+)["']/i)
            );
            const feedThumb = entry ? rx(entry, /<media:thumbnail[^>]+url=["']([^"']+)["']/i) : null;

            const title = decode(rawTitle) || 'More em um Tegra';
            const description = decode(rawDescription) || 'Filme da campanha More em um Tegra.';
            const thumbnail = feedThumb || `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;
            const embedUrl = `https://www.youtube-nocookie.com/embed/${videoId}`;
            const videoEntityId = 'https://www.moretegra.com.br/#campaign-video';
            const logoUrl = 'https://s3-gdigital.s3.amazonaws.com/gdigital/313/Logo_Tegra_Amarelo%20666X375%20SemFundo.webp';

            let home = fs.readFileSync(homePath,'utf8');
            let validator = fs.readFileSync(validatorPath,'utf8');
            if (home.includes('id="mt-home-video-schema"')) throw new Error('Homepage VideoObject already exists; refusing duplicate insertion');

            const imageAnchor = '"primaryImageOfPage":{"@id":"https://www.moretegra.com.br/#home-image"},\n        "inLanguage":"pt-BR"';
            if (!home.includes(imageAnchor)) throw new Error('CollectionPage primaryImage anchor not found');
            home = home.replace(imageAnchor, '"primaryImageOfPage":{"@id":"https://www.moretegra.com.br/#home-image"},\n        "video":{"@id":"' + videoEntityId + '"},\n        "inLanguage":"pt-BR"');

            const tegraAnchor = '"name":"Tegra Incorporadora",\n        "url":"https://www.tegraincorporadora.com.br/",\n        "brand":{"@id":"https://www.moretegra.com.br/#tegra-brand"}';
            if (!home.includes(tegraAnchor)) throw new Error('Authoritative Tegra entity anchor not found');
            home = home.replace(tegraAnchor, '"name":"Tegra Incorporadora",\n        "url":"https://www.tegraincorporadora.com.br/",\n        "logo":"' + logoUrl + '",\n        "brand":{"@id":"https://www.moretegra.com.br/#tegra-brand"}');

            const localLogoAnchor = '"priceRange":"Consulte condições",\n    "identifier"';
            if (!home.includes(localLogoAnchor)) throw new Error('Standalone RealEstateAgent priceRange anchor not found');
            home = home.replace(localLogoAnchor, '"priceRange":"Consulte condições",\n    "logo":"' + logoUrl + '",\n    "identifier"');

            const video = {'@context':'https://schema.org/','@type':'VideoObject','@id':videoEntityId,name:title,description,thumbnailUrl:[thumbnail],uploadDate,embedUrl,inLanguage:'pt-BR',isFamilyFriendly:true};
            if (duration) video.duration = duration;
            const videoScript = `\n  <script id="mt-home-video-schema" type="application/ld+json">\n  ${JSON.stringify(video, null, 2).split('\n').join('\n  ')}\n  <\/script>\n`;
            const gtmAnchor = '\n  <!-- Google Tag Manager -->';
            if (!home.includes(gtmAnchor)) throw new Error('GTM anchor not found');
            home = home.replace(gtmAnchor, videoScript + gtmAnchor);

            const typesAnchor = "requiredTypes: ['WebSite', 'CollectionPage', 'ItemList', 'RealEstateAgent', 'Brand', 'Person', 'Service'],";
            if (!validator.includes(typesAnchor)) throw new Error('Validator home requiredTypes anchor not found');
            validator = validator.replace(typesAnchor, "requiredTypes: ['WebSite', 'CollectionPage', 'ItemList', 'RealEstateAgent', 'Brand', 'Person', 'Service', 'VideoObject'],");
            const idsAnchor = "requiredIds: ['https://www.moretegra.com.br/#website', 'https://www.moretegra.com.br/#webpage', 'https://www.moretegra.com.br/#projects', TEGRA_ID, TEGRA_BRAND_ID, SABRINA_ID, SABRINA_AGENT_ID],";
            if (!validator.includes(idsAnchor)) throw new Error('Validator home requiredIds anchor not found');
            validator = validator.replace(idsAnchor, "requiredIds: ['https://www.moretegra.com.br/#website', 'https://www.moretegra.com.br/#webpage', 'https://www.moretegra.com.br/#projects', 'https://www.moretegra.com.br/#campaign-video', TEGRA_ID, TEGRA_BRAND_ID, SABRINA_ID, SABRINA_AGENT_ID],");

            const validationAnchor = '  if (page.localBusinessScriptId) {';
            if (!validator.includes(validationAnchor)) throw new Error('Validator insertion anchor not found');
            const validationBlock = `  if (page.name === 'home') {\n    const video = typedNode(nodes, 'https://www.moretegra.com.br/#campaign-video', 'VideoObject');\n    if (!video) fail(page.name, 'homepage VideoObject missing');\n    else {\n      if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(video.uploadDate ?? '')) fail(page.name, 'homepage VideoObject uploadDate missing or invalid');\n      if (![].concat(video.thumbnailUrl ?? []).some((value) => typeof value === 'string' && value.startsWith('https://'))) fail(page.name, 'homepage VideoObject thumbnailUrl missing');\n      if (video.embedUrl !== 'https://www.youtube-nocookie.com/embed/SCCM3vzNlyk') fail(page.name, 'homepage VideoObject embedUrl mismatch');\n    }\n  }\n\n`;
            validator = validator.replace(validationAnchor, validationBlock + validationAnchor);

            fs.writeFileSync(homePath, home);
            fs.writeFileSync(validatorPath, validator);
            console.log(JSON.stringify({title, uploadDate, duration, thumbnail, embedUrl, channelId, feedEntryFound:Boolean(entry)}, null, 2));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

          node scripts/validate-m4-05r.mjs
      - name: Commit one consolidated runtime change
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_oneoff-home-video-rich-result.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-greenn/preview/index.html scripts/validate-m4-05r.mjs
          git commit -m 'feat(schema): add verified homepage VideoObject and organization logo'
          git push origin HEAD:fix/mnt-home-video-rich-result
