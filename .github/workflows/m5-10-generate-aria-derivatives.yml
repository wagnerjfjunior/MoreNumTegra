name: Generate Aria responsive derivatives
on:
  push:
    branches:
      - "diag/m5-10-aria-derivatives-20260922"
    paths:
      - ".github/workflows/m5-10-generate-aria-derivatives.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "diag/m5-10-aria-derivatives-20260922"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.3.0
      - name: Generate Aria hero/gallery derivatives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/aria-higienopolis
          curl -fsSL "https://stracctegra.blob.core.windows.net/assets/EmpreendimentoVitrine/312/ImagemPrincipal/Tegra-Incorporadora-Detalhe-da-Fachada-Apartamento-Studio-Salas-Comerciais-Aria-Higienopolis-Sao-Paulo-SP-1715881825537.jpg" -o /tmp/aria-hero.jpg
          curl -fsSL "https://stracctegra.blob.core.windows.net/assets/EmpreendimentoVitrine/312/Imagem/309b34e4-72f0-48d0-a8f8-1f8e94a90cbb.jpg" -o /tmp/aria-gallery1.jpg
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib

          outdir=Path("assets/aria-higienopolis")

          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()

          def center_crop_ratio(im, ratio):
              w,h=im.size
              cur=w/h
              if cur < ratio:
                  crop_h=round(w/ratio)
                  top=max(0,(h-crop_h)//2)
                  return im.crop((0,top,w,top+crop_h))
              crop_w=round(h*ratio)
              left=max(0,(w-crop_w)//2)
              return im.crop((left,0,left+crop_w,h))

          hero_path=Path("/tmp/aria-hero.jpg")
          hero=Image.open(hero_path).convert("RGB")
          hero_crop=center_crop_ratio(hero,1.15)
          print(f"HERO_SOURCE dimensions={hero.size[0]}x{hero.size[1]} bytes={hero_path.stat().st_size} sha256={sha(hero_path)}")
          print(f"HERO_CROP dimensions={hero_crop.size[0]}x{hero_crop.size[1]} ratio={hero_crop.size[0]/hero_crop.size[1]:.5f}")
          for w in (640,828):
              h=round(w/1.15)
              img=hero_crop.resize((w,h),Image.Resampling.LANCZOS)
              p=outdir/f"hero-mobile-{w}.webp"
              img.save(p,"WEBP",quality=82,method=6)
              print(f"HERO_DERIVATIVE width={w} dimensions={w}x{h} bytes={p.stat().st_size} sha256={sha(p)}")

          gallery_path=Path("/tmp/aria-gallery1.jpg")
          gallery=Image.open(gallery_path).convert("RGB")
          gallery_crop=center_crop_ratio(gallery,4/3)
          print(f"GALLERY_SOURCE dimensions={gallery.size[0]}x{gallery.size[1]} bytes={gallery_path.stat().st_size} sha256={sha(gallery_path)}")
          print(f"GALLERY_CROP dimensions={gallery_crop.size[0]}x{gallery_crop.size[1]} ratio={gallery_crop.size[0]/gallery_crop.size[1]:.5f}")
          for w in (640,828,1080):
              h=round(w*3/4)
              img=gallery_crop.resize((w,h),Image.Resampling.LANCZOS)
              p=outdir/f"gallery1-mobile-{w}.webp"
              img.save(p,"WEBP",quality=82,method=6)
              print(f"GALLERY_DERIVATIVE width={w} dimensions={w}x{h} bytes={p.stat().st_size} sha256={sha(p)}")

          thumb=gallery_crop.resize((240,180),Image.Resampling.LANCZOS)
          tp=outdir/"gallery1-thumb-240.webp"
          thumb.save(tp,"WEBP",quality=78,method=6)
          print(f"THUMB dimensions=240x180 bytes={tp.stat().st_size} sha256={sha(tp)}")
          PY
      - name: Commit derivatives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/aria-higienopolis/
          git diff --cached --stat
          git commit -m "diag: generate Aria responsive derivatives"
          git push origin HEAD:diag/m5-10-aria-derivatives-20260922
