name: Mercado editorial 11 draft gates
on:
  pull_request:
    paths:
      - 'docs/editorial/mercado-2026-10-28/**'
      - 'src-greenn/blog/mercado/**'
      - 'src-greenn/blog/mercado-editorial.*'
      - 'src-greenn/empreendimentos/riio-by-piero-lissoni/**'
      - 'assets/blog/mercado-2026/**'
      - 'vercel.json'
      - 'scripts/validate-mercado-editorial-20261028.mjs'
      - 'scripts/*riio*'
      - '.github/workflows/mercado-editorial-20261028.yml'
permissions:
  contents: read
jobs:
  draft-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-mercado-editorial-20261028.mjs
      - run: node scripts/validate-riio-editorial-review-20261028.mjs
      - name: Install test-only DOM environment
        run: npm install --prefix "$RUNNER_TEMP/riio-dom" --no-audit --no-fund jsdom@26.1.0
      - name: Verify gallery interactions
        env:
          RIIO_JSDOM_MODULE: ${{ runner.temp }}/riio-dom/node_modules/jsdom/lib/api.js
        run: node scripts/test-riio-gallery-20261028.mjs
