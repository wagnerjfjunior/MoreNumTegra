name: Global measurement coverage
on:
  pull_request:
    paths:
      - 'src-greenn/**'
      - 'sitemap.xml'
      - 'vercel.json'
      - 'scripts/validate-global-measurement.mjs'
      - '.github/workflows/global-measurement.yml'
  push:
    branches: [main]
    paths:
      - 'src-greenn/**'
      - 'sitemap.xml'
      - 'vercel.json'
      - 'scripts/validate-global-measurement.mjs'
      - '.github/workflows/global-measurement.yml'
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-global-measurement.mjs
      - run: node --check src-greenn/blog/measurement-editorial.js && node --check src-greenn/preview/measurement-core.js && node --check src-greenn/investimentos/calculadora-rentabilidade.js
