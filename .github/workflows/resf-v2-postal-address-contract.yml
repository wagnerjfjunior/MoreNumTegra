name: RESF V2 approved project postal addresses
on:
  pull_request:
    paths:
      - 'src-greenn/empreendimentos/**/index.html'
      - 'scripts/validate-resf-v2-postal-address-contract.mjs'
      - '.github/workflows/resf-v2-postal-address-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate original JSON-LD schema and 23 approved PostalAddress values
        run: |
          node --check scripts/validate-resf-v2-postal-address-contract.mjs
          node scripts/validate-resf-v2-postal-address-contract.mjs
