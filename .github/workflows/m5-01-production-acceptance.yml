name: M5-01 Production acceptance diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m5-01-production-acceptance.yml"
      - ".github/diagnostics/m5-01-production-acceptance.mjs"
      - ".github/diagnostics/m5-01-production-triage.mjs"
  push:
    branches:
      - "diag/m5-01-production-acceptance-20260920"
    paths:
      - ".github/workflows/m5-01-production-acceptance.yml"
      - ".github/diagnostics/m5-01-production-acceptance.mjs"
      - ".github/diagnostics/m5-01-production-triage.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_RUNTIME_SHA: "16515a8c69e30dd97e04e092ded3077ea396319f"
      BASE_URL: "https://www.moretegra.com.br"
    steps:
      - name: Checkout diagnostic
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install diagnostic dependencies
        run: npm install --no-save playwright@1.55.0 axe-core@4.10.3

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run focused M5-01 Production triage
        run: node .github/diagnostics/m5-01-production-triage.mjs

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-01-production-triage
          path: |
            m5-01-production-triage-results.json
            m5-01-production-triage-summary.txt
          if-no-files-found: error
