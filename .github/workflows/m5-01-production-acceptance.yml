name: M5-01 final Production acceptance

on:
  push:
    branches:
      - "diag/m5-01-production-acceptance-20260920"
    paths:
      - ".github/workflows/m5-01-production-acceptance.yml"
      - ".github/diagnostics/m5-01-production-final.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout diagnostic
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install diagnostic dependencies
        run: npm install --no-save playwright@1.55.0 axe-core@4.10.3

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run final Production acceptance matrix
        run: node .github/diagnostics/m5-01-production-final.mjs

      - name: Upload Production acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-01-production-final
          path: |
            m5-01-production-final.json
            m5-01-production-final.txt
          if-no-files-found: error
