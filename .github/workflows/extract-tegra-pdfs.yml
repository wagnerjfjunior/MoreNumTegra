name: Extract Tegra PDFs

on:
  push:
    branches:
      - data/consolidate-tegra-agosto
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Extract text and metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted/text extracted/meta extracted/pages extracted/source/Tabela extracted/source/Espelho
          : > extracted/MANIFEST.tsv
          printf 'source\tpages\tsize_bytes\tsha256\n' >> extracted/MANIFEST.tsv

          cp Tegra/Agosto/Tabela/*.pdf extracted/source/Tabela/
          cp Tegra/Agosto/Espelho/*.pdf extracted/source/Espelho/

          while IFS= read -r -d '' f; do
            rel="${f#Tegra/Agosto/}"
            safe="$(printf '%s' "$rel" | sed 's#[/ ]#_#g; s/\.pdf$//')"
            pdftotext -layout "$f" "extracted/text/${safe}.txt"
            pdfinfo "$f" > "extracted/meta/${safe}.txt"
            pages="$(pdfinfo "$f" | awk -F: '/^Pages:/ {gsub(/ /,"",$2); print $2}')"
            size="$(stat -c%s "$f")"
            sha="$(sha256sum "$f" | awk '{print $1}')"
            printf '%s\t%s\t%s\t%s\n' "$rel" "$pages" "$size" "$sha" >> extracted/MANIFEST.tsv
            pdftoppm -f 1 -singlefile -png -r 120 "$f" "extracted/pages/${safe}-p1" >/dev/null 2>&1 || true
          done < <(find 'Tegra/Agosto/Tabela' 'Tegra/Agosto/Espelho' -type f -name '*.pdf' -print0 | sort -z)

      - name: Upload extracted corpus
        uses: actions/upload-artifact@v4
        with:
          name: tegra-agosto-extracted
          path: extracted/
          if-no-files-found: error
          retention-days: 7
