name: M5-10 Elo GTM block paired lab

on:
  push:
    branches:
      - "diag/m5-10-elo-gtm-block-paired-20260921"
    paths:
      - ".github/diagnostics/m5-10-elo-gtm-block-paired.mjs"
      - ".github/workflows/m5-10-elo-gtm-block-paired.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Lighthouse
        run: npm install --no-save lighthouse@13.5.0
      - name: Confirm blocked URL capability
        run: ./node_modules/.bin/lighthouse --help | grep -A2 "blocked-url-patterns"
      - name: Confirm Chrome
        run: google-chrome --version || chromium --version || chromium-browser --version
      - name: Run paired normal vs GTM-blocked measurements
        run: node .github/diagnostics/m5-10-elo-gtm-block-paired.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-10-elo-gtm-block-paired
          path: m5-10-elo-gtm-block-paired/
          if-no-files-found: error
