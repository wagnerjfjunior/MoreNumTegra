name: Ampere SEO commercial copy
on:
  pull_request:
    paths:
      - 'src-greenn/empreendimentos/ampere-brooklin/index.html'
      - 'scripts/validate-ampere-seo-commercial-copy.mjs'
      - '.github/workflows/ampere-seo-commercial-copy.yml'
  workflow_dispatch:
jobs:
  editorial-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-ampere-seo-commercial-copy.mjs
