name: B4-PROD HTTP characterization

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/b4-prod-http-characterization.yml'
  pull_request:
    paths:
      - '.github/workflows/b4-prod-http-characterization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    name: Characterize canonical HTTP routing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe raw production HTTP responses
        shell: bash
        run: |
          set -euo pipefail

          probe() {
            local url="$1"
            local expected="$2"
            local location_pattern="${3:-}"
            local headers
            headers="$(mktemp)"
            curl -sS --max-redirs 0 -o /dev/null -D "$headers" "$url"
            local status location
            status="$(awk 'toupper($1) ~ /^HTTP\// {s=$2} END {print s}' "$headers")"
            location="$(awk -F': ' 'tolower($1)=="location" {gsub("\r","",$2); print $2}' "$headers" | tail -1)"
            echo "URL=$url STATUS=$status LOCATION=$location"
            test "$status" = "$expected"
            if [ -n "$location_pattern" ]; then
              printf '%s' "$location" | grep -Eq "$location_pattern"
            fi
          }

          probe "https://www.moretegra.com.br/" "200"
          probe "https://www.moretegra.com.br/empreendimentos/capiitolo-piero-lissoni" "308" 'capiitolo-piero-lissoni/$'
          probe "https://www.moretegra.com.br/empreendimentos/capiitolo-piero-lissoni/" "200"
          probe "https://www.moretegra.com.br/empreendimentos/caminhos-da-lapa-elo-duo" "308" 'caminhos-da-lapa-elo-duo/$'
          probe "https://www.moretegra.com.br/empreendimentos/caminhos-da-lapa-elo-duo/" "200"
          probe "https://www.moretegra.com.br/empreendimentos/aria-higienopolis" "308" 'aria-higienopolis/$'
          probe "https://www.moretegra.com.br/empreendimentos/aria-higienopolis/" "200"
          probe "https://www.moretegra.com.br/obrigado" "308" '/obrigado/$'
          probe "https://www.moretegra.com.br/obrigado/" "200"
          probe "https://www.moretegra.com.br/sitemap.xml" "200"
          probe "https://www.moretegra.com.br/robots.txt" "200"
          probe "https://www.moretegra.com.br/src-greenn/moretegra.css" "200"
          probe "https://www.moretegra.com.br/src-greenn/preview/runtime.js" "200"
          probe "https://www.moretegra.com.br/_next/image" "308" '/_next/image/$'
          probe "https://www.moretegra.com.br/_next/image/" "404"
          probe "https://www.moretegra.com.br/rota-inexistente-canonical-test" "308" '/rota-inexistente-canonical-test/$'
          probe "https://www.moretegra.com.br/rota-inexistente-canonical-test/" "404"

      - name: Verify query preservation
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          curl -sS --max-redirs 0 -o /dev/null -D "$headers" \
            "https://www.moretegra.com.br/obrigado?l_=123&p_id=456"
          status="$(awk 'toupper($1) ~ /^HTTP\// {s=$2} END {print s}' "$headers")"
          location="$(awk -F': ' 'tolower($1)=="location" {gsub("\r","",$2); print $2}' "$headers" | tail -1)"
          echo "STATUS=$status LOCATION=$location"
          test "$status" = "308"
          printf '%s' "$location" | grep -q '/obrigado/'
          printf '%s' "$location" | grep -q 'l_=123'
          printf '%s' "$location" | grep -q 'p_id=456'

      - name: Verify project-route query preservation
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          curl -sS --max-redirs 0 -o /dev/null -D "$headers" \
            "https://www.moretegra.com.br/empreendimentos/caminhos-da-lapa-elo-duo?utm_source=b4&utm_medium=test"
          status="$(awk 'toupper($1) ~ /^HTTP\// {s=$2} END {print s}' "$headers")"
          location="$(awk -F': ' 'tolower($1)=="location" {gsub("\r","",$2); print $2}' "$headers" | tail -1)"
          echo "STATUS=$status LOCATION=$location"
          test "$status" = "308"
          printf '%s' "$location" | grep -q '/empreendimentos/caminhos-da-lapa-elo-duo/'
          printf '%s' "$location" | grep -q 'utm_source=b4'
          printf '%s' "$location" | grep -q 'utm_medium=test'

      - name: Verify apex to final canonical route
        shell: bash
        run: |
          set -euo pipefail
          result="$(curl -sS -L -o /dev/null --max-redirs 5 \
            -w '%{http_code}|%{num_redirects}|%{url_effective}' \
            'https://moretegra.com.br/empreendimentos/caminhos-da-lapa-elo-duo?l_=123&p_id=456')"
          echo "$result"
          code="${result%%|*}"
          rest="${result#*|}"
          redirects="${rest%%|*}"
          final_url="${rest#*|}"
          test "$code" = "200"
          test "$redirects" -ge 1
          printf '%s' "$final_url" | grep -q '^https://www.moretegra.com.br/empreendimentos/caminhos-da-lapa-elo-duo/'
          printf '%s' "$final_url" | grep -q 'l_=123'
          printf '%s' "$final_url" | grep -q 'p_id=456'

      - name: Verify canonical tags
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            "/empreendimentos/capiitolo-piero-lissoni/" \
            "/empreendimentos/caminhos-da-lapa-elo-duo/" \
            "/empreendimentos/aria-higienopolis/"
          do
            body="$(curl -sS "https://www.moretegra.com.br$path")"
            expected="https://www.moretegra.com.br$path"
            grep -Fq "rel=\"canonical\" href=\"$expected\"" <<<"$body"
            echo "CANONICAL=$expected PASS"
          done

      - name: Verify thank-you noindex
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -sS 'https://www.moretegra.com.br/obrigado/')"
          grep -Eqi '<meta[^>]+name=["'"'"']robots["'"'"'][^>]+content=["'"'"']noindex,nofollow["'"'"']' <<<"$body"
          echo "THANK_YOU_NOINDEX=PASS"
