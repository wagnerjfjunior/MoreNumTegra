name: One-off rich result warning hardening v4

on:
  push:
    paths:
      - '.github/workflows/_oneoff-rich-result-warning-hardening-v4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mnt-rich-result-warning-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch factual rich-result warnings once
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const HOME='src-greenn/preview/index.html',ELO='src-greenn/empreendimentos/caminhos-da-lapa-elo-duo/index.html',CAPI='src-greenn/empreendimentos/capiitolo-piero-lissoni/index.html',FOOTER='src-greenn/blocks/03-footer.html',FAQ='src-greenn/blocks/02-html-pos-form.html',VALIDATOR='scripts/validate-m4-05r.mjs';
          const TEGRA_ID='https://www.tegraincorporadora.com.br/#organization',TEGRA_LOGO='https://www.tegraincorporadora.com.br/images/logo-tegra-color.svg',TEGRA_IMAGE='https://www.tegraincorporadora.com.br/og-image.jpg',TEGRA_PHONE='+55-11-3500-3223',TEGRA_PRICE_RANGE='Consulte-nos',TEGRA_CRECI='028638-J';
          const SABRINA_ID='https://www.moretegra.com.br/#sabrina-real-estate-agent',ESTANDE_ID='https://www.moretegra.com.br/#estande-caminhos-da-lapa',SABRINA_LOGO='https://s3-gdigital.s3.amazonaws.com/gdigital/313/Logo_Tegra_Amarelo%20666X375%20SemFundo.webp',POSTAL='05093-000',PHONE='+5511960779328',CRECI='209.905-F';
          const read=p=>fs.readFileSync(p,'utf8'),write=(p,s)=>fs.writeFileSync(p,s);
          function rep(t,a,b,n,l){const h=t.split(a).length-1;if(h!==n)throw new Error(`${l}: expected ${n}, found ${h}`);return t.split(a).join(b)}
          function walk(v,fn){if(Array.isArray(v)){v.forEach(x=>walk(x,fn));return}if(!v||typeof v!=='object')return;fn(v);Object.values(v).forEach(x=>walk(x,fn))}
          function updateJsonLd(html,id,mut){const re=new RegExp(`(<script\\s+id=["']${id}["']\\s+type=["']application/ld\\+json["']>)([\\s\\S]*?)(<\\/script>)`,'i'),m=html.match(re);if(!m)throw new Error(`#${id} missing`);const d=JSON.parse(m[2]);mut(d);const f='\n  '+JSON.stringify(d,null,2).split('\n').join('\n  ')+'\n  ';return html.replace(re,`${m[1]}${f}${m[3]}`)}
          function harden(d,label){let tegra=0,sabrina=0,estandeDef=0;walk(d,node=>{
            if(node['@id']===TEGRA_ID&&[].concat(node['@type']||[]).includes('RealEstateAgent')){tegra++;Object.assign(node,{name:'Tegra Incorporadora',legalName:'TG SÃO PAULO EMPREENDIMENTOS IMOBILIÁRIOS S.A.',alternateName:'Tegra',description:'Incorporadora de imóveis de alto padrão em São Paulo, Campinas e Rio de Janeiro.',url:'https://www.tegraincorporadora.com.br/',telephone:TEGRA_PHONE,priceRange:TEGRA_PRICE_RANGE,logo:{'@type':'ImageObject',url:TEGRA_LOGO,width:250,height:60},image:TEGRA_IMAGE,identifier:{'@type':'PropertyValue',propertyID:'CRECI',value:TEGRA_CRECI},address:{'@type':'PostalAddress',streetAddress:'Av. das Nações Unidas, 14.401, Torre Paineira, 1º andar',addressLocality:'São Paulo',addressRegion:'SP',postalCode:'04794-000',addressCountry:'BR'},sameAs:['https://www.instagram.com/tegraincorporadora','https://www.linkedin.com/company/tegraincorporadora','https://www.facebook.com/tegraincorporadora','https://www.youtube.com/tegraincorporadora','https://www.pinterest.com/tegraincorporadora']})}
            if(node['@id']===SABRINA_ID&&[].concat(node['@type']||[]).includes('RealEstateAgent')){sabrina++;Object.assign(node,{priceRange:'Consulte condições',logo:SABRINA_LOGO,image:SABRINA_LOGO,identifier:{'@type':'PropertyValue',propertyID:'CRECI-SP',value:CRECI}});if(node.address?.['@type']!=='PostalAddress')throw new Error(`${label}: Sabrina address missing`);node.address.postalCode=POSTAL}
            if(node['@id']===ESTANDE_ID&&node.address?.['@type']==='PostalAddress'){estandeDef++;node.address.postalCode=POSTAL}
          });if(tegra!==1||sabrina!==1||estandeDef!==1)throw new Error(`${label}: definitions tegra=${tegra} sabrina=${sabrina} estande=${estandeDef}`)}

          let home=read(HOME),elo=read(ELO),capi=read(CAPI),footer=read(FOOTER),faq=read(FAQ),validator=read(VALIDATOR);
          home=updateJsonLd(home,'mt-search-schema',d=>harden(d,'home'));
          home=updateJsonLd(home,'mt-localbusiness-schema',d=>{if(d['@id']!==SABRINA_ID)throw new Error('standalone Sabrina id mismatch');Object.assign(d,{priceRange:'Consulte condições',logo:SABRINA_LOGO,image:SABRINA_LOGO,identifier:{'@type':'PropertyValue',propertyID:'CRECI-SP',value:CRECI}});d.address.postalCode=POSTAL});
          elo=updateJsonLd(elo,'mt-project-schema',d=>harden(d,'elo'));
          capi=updateJsonLd(capi,'mnt-capiitolo-schema',d=>harden(d,'capi'));

          home=rep(home,'Estande Tegra Caminhos da Lapa · Rua Fortunato Ferraz, 625 — São Paulo/SP · <a','Estande Tegra Caminhos da Lapa · Rua Fortunato Ferraz, 625 — São Paulo/SP · CEP 05093-000 · <a',1,'home visible CEP');
          elo=rep(elo,'Estande Tegra Caminhos da Lapa · Rua Fortunato Ferraz, 625 — São Paulo/SP<br>','Estande Tegra Caminhos da Lapa · Rua Fortunato Ferraz, 625 — São Paulo/SP · CEP 05093-000<br>',1,'elo visible CEP');
          capi=rep(capi,`<p><strong>Sabrina da Tegra</strong> · Corretora Tegra Vendas · CRECI-SP ${CRECI} · <a href="tel:${PHONE}">(11) 96077-9328</a>.</p>`,`<p><strong>Sabrina da Tegra</strong> · Corretora Tegra Vendas · CRECI-SP ${CRECI} · Estande Tegra Caminhos da Lapa · Rua Fortunato Ferraz, 625 · São Paulo/SP · CEP ${POSTAL} · <a href="tel:${PHONE}">(11) 96077-9328</a>.</p>`,1,'capi initial CEP');
          capi=rep(capi,'Estande Tegra Caminhos da Lapa · Rua Fortunato Ferraz, 625 — São Paulo/SP<br>','Estande Tegra Caminhos da Lapa · Rua Fortunato Ferraz, 625 — São Paulo/SP · CEP 05093-000<br>',1,'capi dynamic CEP');
          footer=rep(footer,'<p><strong>Atendimento Tegra Vendas.</strong><br>Use o formulário ou o WhatsApp desta página para negociar.</p>',`<p><strong>Sabrina da Tegra · Corretora Tegra Vendas · CRECI-SP ${CRECI}.</strong><br>Estande Tegra Caminhos da Lapa · Rua Fortunato Ferraz, 625 · São Paulo/SP · CEP ${POSTAL}.<br><a href="tel:${PHONE}">(11) 96077-9328</a> · <a href="https://corretor.tegravendas.com.br/sabrina/sp" target="_blank" rel="noopener noreferrer">perfil oficial Tegra Vendas</a></p>`,1,'footer parity');
          faq=rep(faq,'https://moretegra.com.br/#faq','https://www.moretegra.com.br/#faq',1,'FAQ id');faq=rep(faq,'https://moretegra.com.br/#webpage','https://www.moretegra.com.br/#webpage',1,'FAQ parent');

          validator=rep(validator,`const SABRINA_CRECI = '${CRECI}';`,`const SABRINA_CRECI = '${CRECI}';\nconst SABRINA_POSTAL_CODE = '${POSTAL}';\nconst SABRINA_BUSINESS_IMAGE = '${SABRINA_LOGO}';\nconst TEGRA_PHONE = '${TEGRA_PHONE}';\nconst TEGRA_PRICE_RANGE = '${TEGRA_PRICE_RANGE}';\nconst TEGRA_LOGO = '${TEGRA_LOGO}';\nconst TEGRA_IMAGE = '${TEGRA_IMAGE}';`,1,'validator constants');
          validator=rep(validator,`const tegra = typedNode(nodes, TEGRA_ID, 'RealEstateAgent');\n  if (!tegra) fail(page.name, 'authoritative Tegra entity definition missing or wrong type');\n  else if (tegra.brand?.['@id'] !== TEGRA_BRAND_ID) fail(page.name, 'Tegra brand must be attached to the authoritative organization entity');`,`const tegra = typedNode(nodes, TEGRA_ID, 'RealEstateAgent');\n  if (!tegra) fail(page.name, 'authoritative Tegra entity definition missing or wrong type');\n  else {\n    if (tegra.brand?.['@id'] !== TEGRA_BRAND_ID) fail(page.name, 'Tegra brand must be attached to the authoritative organization entity');\n    if (tegra.telephone !== TEGRA_PHONE || tegra.priceRange !== TEGRA_PRICE_RANGE || tegra.image !== TEGRA_IMAGE) fail(page.name, 'authoritative Tegra rich-result fields mismatch');\n    if (tegra.logo?.url !== TEGRA_LOGO || tegra.address?.postalCode !== '04794-000') fail(page.name, 'authoritative Tegra identity/address mismatch');\n  }`,1,'validator Tegra');
          validator=rep(validator,`if (a?.['@type'] !== 'PostalAddress' || a.streetAddress !== 'Rua Fortunato Ferraz, 625' || a.addressLocality !== 'São Paulo' || a.addressRegion !== 'SP' || a.addressCountry !== 'BR') fail(page.name, 'Sabrina RealEstateAgent address mismatch');`,`if (a?.['@type'] !== 'PostalAddress' || a.streetAddress !== 'Rua Fortunato Ferraz, 625' || a.addressLocality !== 'São Paulo' || a.addressRegion !== 'SP' || a.postalCode !== SABRINA_POSTAL_CODE || a.addressCountry !== 'BR') fail(page.name, 'Sabrina RealEstateAgent address mismatch');\n    if (sabrinaAgent.priceRange !== 'Consulte condições' || sabrinaAgent.logo !== SABRINA_BUSINESS_IMAGE || sabrinaAgent.image !== SABRINA_BUSINESS_IMAGE) fail(page.name, 'Sabrina RealEstateAgent recommended fields mismatch');\n    if (sabrinaAgent.identifier?.propertyID !== 'CRECI-SP' || sabrinaAgent.identifier?.value !== SABRINA_CRECI) fail(page.name, 'Sabrina RealEstateAgent CRECI identifier mismatch');`,1,'validator Sabrina');
          validator=rep(validator,`if (local.address?.['@type'] !== 'PostalAddress' || !local.address?.streetAddress) fail(page.name, 'standalone LocalBusiness physical address missing');`,`if (local.address?.['@type'] !== 'PostalAddress' || !local.address?.streetAddress || local.address?.postalCode !== SABRINA_POSTAL_CODE) fail(page.name, 'standalone LocalBusiness physical address/postalCode missing');\n        if (local.priceRange !== 'Consulte condições' || local.image !== SABRINA_BUSINESS_IMAGE || local.logo !== SABRINA_BUSINESS_IMAGE) fail(page.name, 'standalone LocalBusiness recommended fields mismatch');`,1,'validator standalone');

          write(HOME,home);write(ELO,elo);write(CAPI,capi);write(FOOTER,footer);write(FAQ,faq);write(VALIDATOR,validator);
          NODE
          node scripts/validate-m4-05r.mjs
          grep -q 'CEP 05093-000' src-greenn/preview/index.html
          grep -q 'https://www.moretegra.com.br/#faq' src-greenn/blocks/02-html-pos-form.html
          ! grep -q 'https://moretegra.com.br/#' src-greenn/blocks/02-html-pos-form.html

      - name: Commit one consolidated runtime change
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_oneoff-rich-result-warning-hardening.yml .github/workflows/_oneoff-rich-result-warning-hardening-v3.yml .github/workflows/_oneoff-rich-result-warning-hardening-v4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-greenn/preview/index.html src-greenn/empreendimentos/caminhos-da-lapa-elo-duo/index.html src-greenn/empreendimentos/capiitolo-piero-lissoni/index.html src-greenn/blocks/03-footer.html src-greenn/blocks/02-html-pos-form.html scripts/validate-m4-05r.mjs
          git commit -m 'fix(schema): harden factual rich-result warnings'
          git push origin HEAD:fix/mnt-rich-result-warning-hardening
