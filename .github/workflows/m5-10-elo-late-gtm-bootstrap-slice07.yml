name: M5-10 Elo late GTM bootstrap slice 07

on:
  pull_request:
    paths:
      - "src-greenn/empreendimentos/caminhos-da-lapa-elo-duo/index.html"
      - "src-greenn/preview/runtime.js"
      - "scripts/validate-m5-10-elo-late-gtm-bootstrap-slice07.mjs"
      - ".github/diagnostics/m5-10-elo-late-gtm-bootstrap-smoke.mjs"
      - ".github/workflows/m5-10-elo-late-gtm-bootstrap-slice07.yml"
  push:
    branches: [main]
    paths:
      - "src-greenn/empreendimentos/caminhos-da-lapa-elo-duo/index.html"
      - "src-greenn/preview/runtime.js"
      - "scripts/validate-m5-10-elo-late-gtm-bootstrap-slice07.mjs"
      - ".github/diagnostics/m5-10-elo-late-gtm-bootstrap-smoke.mjs"
      - ".github/workflows/m5-10-elo-late-gtm-bootstrap-slice07.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Static delayed GTM contract
        run: node scripts/validate-m5-10-elo-late-gtm-bootstrap-slice07.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local Vercel-equivalent route
        run: |
          python3 - <<'PY' > /tmp/m5-10-gtm-server.log 2>&1 &
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          class Handler(SimpleHTTPRequestHandler):
              def do_GET(self):
                  route=self.path.split("?",1)[0]
                  mapping={
                      "/empreendimentos/caminhos-da-lapa-elo-duo/":"/src-greenn/empreendimentos/caminhos-da-lapa-elo-duo/index.html",
                  }
                  self.path=mapping.get(route,self.path)
                  return super().do_GET()
          ThreadingHTTPServer(("127.0.0.1",4173),Handler).serve_forever()
          PY
          sleep 1
      - name: Browser bootstrap + consent smoke
        run: node .github/diagnostics/m5-10-elo-late-gtm-bootstrap-smoke.mjs
      - name: Preserve selected Green media contract
        run: node scripts/validate-m5-10-elo-green-media-slice01.mjs
      - name: Preserve commercial page contract
        run: node scripts/validate-commercial-page-standard.mjs
      - name: Preserve CTA/Form journey contract
        run: node scripts/validate-m5-06-cta-form-journey.mjs
      - name: Preserve lead semantics contract
        run: node scripts/validate-m5-07-lead-semantics.mjs
