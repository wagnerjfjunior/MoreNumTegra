name: DSG CAPIITOLO hero exception
on:
  pull_request:
    paths:
      - 'src-greenn/empreendimentos/dsg-itaim/index.html'
      - 'src-greenn/empreendimentos/capiitolo-piero-lissoni/index.html'
      - 'experiments/dsg-itaim-editorial-v3/index.html'
      - 'experiments/capiitolo-editorial-v3/index.html'
      - 'scripts/validate-dsg-capiitolo-hero-exception.mjs'
      - '.github/workflows/dsg-capiitolo-hero-exception.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and governed hero contracts
        run: |
          node --check scripts/validate-dsg-capiitolo-hero-exception.mjs
          node scripts/validate-dsg-capiitolo-hero-exception.mjs
      - name: Check three S3 images are accessible
        run: |
          node --input-type=module <<'NODE'
          const urls=[
            'https://s3-gdigital.s3.amazonaws.com/gdigital/313/MoreTegra-Torre-Fechada-DSG-Itaim-9x16.webp',
            'https://s3-gdigital.s3.amazonaws.com/gdigital/313/More-Tegra-Foto-DSG-Itaim-Rua-Joaquim-Floriano-Vista-area-da-Fachada-e-Avenida.webp',
            'https://s3-gdigital.s3.amazonaws.com/gdigital/313/Fachada_Capitolo.webp'
          ];
          for(const url of urls){
            const response=await fetch(url,{method:'HEAD',signal:AbortSignal.timeout(10000)});
            if(!response.ok || !response.headers.get('content-type')?.startsWith('image/')){
              throw new Error('Image check failed: '+response.status+' '+url);
            }
            console.log('OK',response.status,response.headers.get('content-type'),response.headers.get('content-length'),url);
          }
          NODE
      - name: Inspect real image dimensions
        run: |
          curl -fsSL --max-time 20 'https://s3-gdigital.s3.amazonaws.com/gdigital/313/Fachada_Capitolo.webp' -o /tmp/capiitolo-hero.webp
          curl -fsSL --max-time 20 'https://s3-gdigital.s3.amazonaws.com/gdigital/313/More-Tegra-Foto-DSG-Itaim-Rua-Joaquim-Floriano-Vista-area-da-Fachada-e-Avenida.webp' -o /tmp/dsg-desktop.webp
          curl -fsSL --max-time 20 'https://s3-gdigital.s3.amazonaws.com/gdigital/313/MoreTegra-Torre-Fechada-DSG-Itaim-9x16.webp' -o /tmp/dsg-mobile.webp
          file /tmp/capiitolo-hero.webp /tmp/dsg-desktop.webp /tmp/dsg-mobile.webp
