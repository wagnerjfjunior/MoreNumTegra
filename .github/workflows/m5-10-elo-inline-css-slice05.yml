name: M5-10 Elo inline CSS slice 05

on:
  pull_request:
    paths:
      - "src-greenn/empreendimentos/caminhos-da-lapa-elo-duo/index.html"
      - "src-greenn/project-page.css"
      - "scripts/validate-m5-10-elo-inline-css-slice05.mjs"
      - ".github/workflows/m5-10-elo-inline-css-slice05.yml"
  push:
    branches: [main]
    paths:
      - "src-greenn/empreendimentos/caminhos-da-lapa-elo-duo/index.html"
      - "src-greenn/project-page.css"
      - "scripts/validate-m5-10-elo-inline-css-slice05.mjs"
      - ".github/workflows/m5-10-elo-inline-css-slice05.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Slice 05 inline CSS contract
        run: node scripts/validate-m5-10-elo-inline-css-slice05.mjs
      - name: Preserve selected Green media contract
        run: node scripts/validate-m5-10-elo-green-media-slice01.mjs
      - name: Preserve commercial page contract
        run: node scripts/validate-commercial-page-standard.mjs
      - name: Preserve favicon contract
        run: node scripts/validate-favicon-standard.mjs
      - name: Preserve CTA/Form journey contract
        run: node scripts/validate-m5-06-cta-form-journey.mjs
      - name: Preserve lead semantics contract
        run: node scripts/validate-m5-07-lead-semantics.mjs
