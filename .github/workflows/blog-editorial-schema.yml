name: Blog editorial schema standard
on:
  pull_request:
    paths:
      - 'src-greenn/blog/**'
      - 'src-greenn/investimentos/calculadora-rentabilidade-imovel/index.html'
      - 'sitemap.xml'
      - 'scripts/validate-blog-editorial-schema.mjs'
      - '.github/workflows/blog-editorial-schema.yml'
  push:
    branches: [main]
    paths:
      - 'src-greenn/blog/**'
      - 'src-greenn/investimentos/calculadora-rentabilidade-imovel/index.html'
      - 'sitemap.xml'
      - 'scripts/validate-blog-editorial-schema.mjs'
      - '.github/workflows/blog-editorial-schema.yml'
permissions:
  contents: read
jobs:
  editorial-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-blog-editorial-schema.mjs
