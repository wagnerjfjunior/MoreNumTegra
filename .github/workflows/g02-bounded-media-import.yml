name: G02 bounded media import
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  import:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/resf-g02-replicate-g01-20261127'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - name: Import exact responsive derivatives
        run: |
          python - <<'PY'
          import urllib.request, hashlib, json, io, pathlib
          from PIL import Image
          root=pathlib.Path('assets/resf')
          manifest=json.loads((root/'manifest.json').read_text())
          rows=[
            ('nova-vivere','tegra-nova-vivere-caminhos-da-lapa-piscina-sao-paulo-640x574.webp'),
            ('garden-design','tegra-garden-design-private-park-residence-piscina-lapa-sao-paulo-640x574.webp'),
            ('reserva-caminhos-da-lapa','tegra-reserva-caminhos-da-lapa-fachada-sao-paulo-640x1067.webp'),
            ('ypy-alto-do-ipiranga','tegra-ypy-alto-do-ipiranga-piscina-sao-paulo-640x574.webp'),
            ('capiitolo-piero-lissoni','tegra-capiitolo-piero-lissoni-fachada-chacara-klabin-sao-paulo-640x574.webp'),
            ('dsg-itaim','tegra-dsg-itaim-fachada-itaim-bibi-sao-paulo-640x960.webp'),
          ]
          for slug,name in rows:
            url='https://s3-gdigital.s3.amazonaws.com/gdigital/313/'+name
            with urllib.request.urlopen(url,timeout=30) as res:
              assert res.status==200
              data=res.read(160000)
            im=Image.open(io.BytesIO(data)); im.load()
            assert im.format=='WEBP' and im.width==640 and len(data)<102400
            dest=root/slug/name
            dest.parent.mkdir(parents=True,exist_ok=True)
            dest.write_bytes(data)
            manifest[slug]={'source':url,'source_width':im.width,'source_height':im.height,'source_bytes':len(data),'variants':[{'path':str(dest),'width':im.width,'height':im.height,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'provenance':'owner-uploaded WebP; byte-for-byte copy'}]}
            print(slug,im.size,len(data),hashlib.sha256(data).hexdigest())
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n')
          PY
          git add assets/resf
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "perf: import six bounded owner-provided mobile derivatives"
            git push origin HEAD:fix/resf-g02-replicate-g01-20261127
          fi
