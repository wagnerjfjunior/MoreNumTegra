name: Bem Moema AP0202 product and reference offer
on:
  pull_request:
    paths:
      - 'src-greenn/empreendimentos/bem-moema/index.html'
      - 'scripts/validate-bem-moema-ap0202-product-offer.mjs'
      - '.github/workflows/bem-moema-ap0202-product-offer.yml'
  workflow_dispatch:
jobs:
  factual-offer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-bem-moema-ap0202-product-offer.mjs
