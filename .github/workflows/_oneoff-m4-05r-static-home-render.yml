name: One-off M4-05R static home render

on:
  push:
    branches:
      - fix/mnt-m4-05r-static-home-render

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Flatten homepage and stop metadata mutation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const indexPath = 'src-greenn/preview/index.html';
          const jsPath = 'src-greenn/moretegra.js';
          const validatorPath = 'scripts/validate-m4-05r.mjs';
          const block1Path = 'src-greenn/blocks/01-html-inicial.html';
          const block2Path = 'src-greenn/blocks/02-html-pos-form.html';
          const block3Path = 'src-greenn/blocks/03-footer.html';

          let html = fs.readFileSync(indexPath, 'utf8');
          let block1 = fs.readFileSync(block1Path, 'utf8').trim();
          const block2 = fs.readFileSync(block2Path, 'utf8').trim();
          const block3 = fs.readFileSync(block3Path, 'utf8').trim();
          let appJs = fs.readFileSync(jsPath, 'utf8');
          let validator = fs.readFileSync(validatorPath, 'utf8');

          const indent = (text, spaces = 2) => text.split('\n').map((line) => `${' '.repeat(spaces)}${line}`).join('\n');

          block1 = block1.replace(/\n\s*<div id="formulario" class="mt-form-anchor" data-form-anchor aria-hidden="true"><\/div>\s*\n/, '\n');

          const block1Start = html.indexOf('  <div id="mt-block-01">');
          const leadStart = html.indexOf('  <section class="mt-lead-section"', block1Start);
          if (block1Start < 0 || leadStart < 0) throw new Error('home block-01/lead markers not found');
          html = html.slice(0, block1Start) + indent(block1) + '\n\n' + html.slice(leadStart);

          if (!html.includes('  <div id="mt-block-02"></div>')) throw new Error('block-02 placeholder not found');
          if (!html.includes('  <div id="mt-block-03"></div>')) throw new Error('block-03 placeholder not found');
          html = html.replace('  <div id="mt-block-02"></div>', indent(block2));
          html = html.replace('  <div id="mt-block-03"></div>', indent(block3));

          const loaderStartNeedle = '  <script>\n    (() => {\n      const blocks = [';
          const loaderStart = html.indexOf(loaderStartNeedle);
          if (loaderStart < 0) throw new Error('dynamic block loader start not found');
          const loaderEnd = html.indexOf('  </script>', loaderStart);
          if (loaderEnd < 0) throw new Error('dynamic block loader end not found');
          html = html.slice(0, loaderStart) + html.slice(loaderEnd + '  </script>'.length);

          const portalScript = '  <script src="/src-greenn/portal-links.js" defer></script>';
          if (!html.includes(portalScript)) throw new Error('portal-links script marker not found');
          if (!html.includes('src="/src-greenn/moretegra.js"')) {
            html = html.replace(portalScript, `${portalScript}\n  <script src="/src-greenn/moretegra.js" defer></script>`);
          }

          const formIds = (html.match(/id="formulario"/g) || []).length;
          if (formIds !== 1) throw new Error(`expected exactly one #formulario, found ${formIds}`);
          if (html.includes('const blocks = [') || html.includes('fetch(url, {cache:"no-store"})')) throw new Error('dynamic block loader still present');
          if (html.includes('data-moretegra-fallback')) throw new Error('fallback-only root still present');
          if (!html.includes('data-moretegra')) throw new Error('static MoreNumTegra root missing');

          const metaStart = appJs.indexOf('  const SEARCH_METADATA = Object.freeze({');
          const brlStart = appJs.indexOf('  const BRL = new Intl.NumberFormat', metaStart);
          if (metaStart < 0 || brlStart < 0) throw new Error('legacy metadata mutation block not found');
          appJs = appJs.slice(0, metaStart) + appJs.slice(brlStart);

          const bootNeedle = '  function boot() {\n    applySearchMetadata();\n    initAll();\n    mountFloatingActions();\n  }';
          if (!appJs.includes(bootNeedle)) throw new Error('boot metadata call not found');
          const prefillAndBoot = `  function prefillInterestFromUrl() {\n    const interest = new URLSearchParams(window.location.search).get("interesse");\n    const input = document.getElementById("mt-lead-project");\n    if (!interest || !input || input.value) return;\n    input.value = interest;\n  }\n\n  function boot() {\n    prefillInterestFromUrl();\n    initAll();\n    mountFloatingActions();\n  }`;
          appJs = appJs.replace(bootNeedle, prefillAndBoot);
          if (appJs.includes('applySearchMetadata') || appJs.includes('SEARCH_METADATA')) throw new Error('legacy metadata mutation code still present');

          const guard = `\nconst staticHome = await readFile('src-greenn/preview/index.html', 'utf8');\nconst staticHomeJs = await readFile('src-greenn/moretegra.js', 'utf8');\nif (staticHome.includes('const blocks = [') || staticHome.includes('fetch(url, {cache:"no-store"})')) fail('home', 'client-side primary block loader must not exist');\nif (staticHome.includes('id="mt-block-02"') || staticHome.includes('id="mt-block-03"') || staticHome.includes('data-moretegra-fallback')) fail('home', 'dynamic/fallback block placeholders remain in initial HTML');\nif (!staticHome.includes('src="/src-greenn/moretegra.js" defer')) fail('home', 'static moretegra.js include missing');\nif ((staticHome.match(/id="formulario"/g) || []).length !== 1) fail('home', 'initial HTML must contain exactly one #formulario');\nif (!staticHome.includes('data-moretegra')) fail('home', 'primary MoreNumTegra content missing from initial HTML');\nif (staticHomeJs.includes('applySearchMetadata') || staticHomeJs.includes('SEARCH_METADATA')) fail('home', 'runtime metadata/schema rewriting must not return');\n`;
          const validationGate = '\nif (failures.length) {';
          if (!validator.includes(validationGate)) throw new Error('validator failure gate not found');
          if (!validator.includes('client-side primary block loader must not exist')) {
            validator = validator.replace(validationGate, guard + validationGate);
          }

          fs.writeFileSync(indexPath, html);
          fs.writeFileSync(jsPath, appJs);
          fs.writeFileSync(validatorPath, validator);
          NODE

          sed -i 's/[[:space:]]\+$//' src-greenn/preview/index.html src-greenn/moretegra.js scripts/validate-m4-05r.mjs
          node scripts/validate-m4-05r.mjs

      - name: Commit bounded runtime correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_oneoff-m4-05r-static-home-render.yml
          git add src-greenn/preview/index.html src-greenn/moretegra.js scripts/validate-m4-05r.mjs
          git diff --cached --check
          git commit -m "fix(home): render primary content statically"
          git push origin HEAD:fix/mnt-m4-05r-static-home-render
