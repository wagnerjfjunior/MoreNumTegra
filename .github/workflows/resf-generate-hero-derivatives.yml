name: Generate RESF hero derivatives
on:
  push:
    branches:
      - fix/resf-responsive-media-20260929
    paths:
      - scripts/generate-resf-hero-derivatives.py
      - .github/workflows/resf-generate-hero-derivatives.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resf-responsive-media-20260929
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - run: python scripts/generate-resf-hero-derivatives.py
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/resf/
          if git diff --cached --quiet; then
            echo "No generated asset changes"
            exit 0
          fi
          git commit -m "perf: generate RESF mobile hero derivatives"
          git push origin HEAD:fix/resf-responsive-media-20260929
