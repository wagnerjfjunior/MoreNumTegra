name: Apply Nova Vivere commercial copy v2

on:
  push:
    branches:
      - feat/nova-vivere-commercial-copy-search-v2-20261002
    paths:
      - '.github/workflows/apply-nova-vivere-commercial-copy-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nova-vivere-commercial-copy-search-v2-20261002
          fetch-depth: 0
      - name: Apply deterministic patch
        shell: pwsh
        run: ./scripts/local/patch-nova-vivere-commercial-copy-v2.ps1
      - name: Verify and commit generated HTML
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain -- src-greenn/empreendimentos/nova-vivere/index.html)"
          ! grep -Fq 'Ambientes sem corte de enquadramento.' src-greenn/empreendimentos/nova-vivere/index.html
          ! grep -Fq 'Para quem pesquisa Nova Vivere Tegra' src-greenn/empreendimentos/nova-vivere/index.html
          grep -Fq 'Conheça os ambientes e áreas de lazer.' src-greenn/empreendimentos/nova-vivere/index.html
          grep -Fq '2 vagas determinadas, sem sorteio' src-greenn/empreendimentos/nova-vivere/index.html
          grep -Fq 'https://schema.org/InStock' src-greenn/empreendimentos/nova-vivere/index.html
          git config user.name 'sfjm-bot'
          git config user.email 'sfjm-bot@users.noreply.github.com'
          git add src-greenn/empreendimentos/nova-vivere/index.html
          git commit -m 'feat(nova-vivere): apply commercial copy and search v2'
          git push origin HEAD:feat/nova-vivere-commercial-copy-search-v2-20261002
