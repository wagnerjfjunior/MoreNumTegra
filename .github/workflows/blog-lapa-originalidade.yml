name: Blog Lapa Originalidade e Analise SEO
on:
  pull_request:
    paths:
      - 'src-greenn/blog/mercado/valorizacao-imobiliaria-lapa-sao-paulo/index.html'
      - 'src-greenn/blog/lapa-artigo.css'
      - 'scripts/validate-blog-lapa-originalidade.mjs'
      - '.github/workflows/blog-lapa-originalidade.yml'
permissions:
  contents: read
jobs:
  editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-blog-lapa-originalidade.mjs
