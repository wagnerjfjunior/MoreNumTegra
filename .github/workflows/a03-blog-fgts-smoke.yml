name: A03 blog FGTS five-viewports smoke

on:
  pull_request:
    paths:
      - "src-greenn/blog/index.html"
      - ".github/diagnostics/a03-blog-fgts-smoke.mjs"
      - ".github/workflows/a03-blog-fgts-smoke.yml"

permissions:
  contents: read

jobs:
  a03-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated Chromium browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test blog → FGTS guide on 360/390/430/900/1440
        run: node .github/diagnostics/a03-blog-fgts-smoke.mjs
