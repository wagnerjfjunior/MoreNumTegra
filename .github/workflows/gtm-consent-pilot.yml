name: GTM consent pilot
on:
  pull_request:
    paths:
      - 'src-greenn/blog/**'
      - 'src-greenn/preview/runtime.js'
      - 'scripts/test-gtm-consent-pilot.mjs'
      - '.github/workflows/gtm-consent-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node scripts/test-gtm-consent-pilot.mjs
      - run: node scripts/validate-global-measurement.mjs
