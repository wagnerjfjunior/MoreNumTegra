name: Blog Lapa SEO Schema
on:
  pull_request:
    paths:
      - 'src-greenn/blog/mercado/lapa-o-novo-polo-de-valorizacao-na-zona-oeste-de-sao-paulo/index.html'
      - 'scripts/validate-blog-lapa-schema.mjs'
      - '.github/workflows/blog-lapa-schema.yml'
  push:
    branches: [main]
    paths:
      - 'src-greenn/blog/mercado/lapa-o-novo-polo-de-valorizacao-na-zona-oeste-de-sao-paulo/index.html'
      - 'scripts/validate-blog-lapa-schema.mjs'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-blog-lapa-schema.mjs
