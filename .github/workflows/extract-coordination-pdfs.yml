name: Extract Coordination PDFs

on:
  push:
    branches:
      - data/reconcile-coordination-august
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Extract text, metadata and preview pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted/text extracted/meta extracted/pages extracted/source
          : > extracted/MANIFEST.tsv
          printf 'source\tpages\tsize_bytes\tsha256\n' >> extracted/MANIFEST.tsv

          cp Tegra/Agosto/Tabela_Coordenação/*.pdf extracted/source/

          while IFS= read -r -d '' f; do
            rel="${f#Tegra/Agosto/Tabela_Coordenação/}"
            safe="$(printf '%s' "$rel" | sed 's#[/ ]#_#g; s/\.pdf$//')"
            pdftotext -layout "$f" "extracted/text/${safe}.txt" || true
            pdfinfo "$f" > "extracted/meta/${safe}.txt" || true
            pages="$(pdfinfo "$f" 2>/dev/null | awk -F: '/^Pages:/ {gsub(/ /,"",$2); print $2}')"
            size="$(stat -c%s "$f")"
            sha="$(sha256sum "$f" | awk '{print $1}')"
            printf '%s\t%s\t%s\t%s\n' "$rel" "${pages:-?}" "$size" "$sha" >> extracted/MANIFEST.tsv
            mkdir -p "extracted/pages/${safe}"
            pdftoppm -f 1 -l 5 -png -r 120 "$f" "extracted/pages/${safe}/page" >/dev/null 2>&1 || true
          done < <(find 'Tegra/Agosto/Tabela_Coordenação' -type f -name '*.pdf' -print0 | sort -z)

      - name: Upload extracted corpus
        uses: actions/upload-artifact@v4
        with:
          name: coordination-agosto-extracted
          path: extracted/
          if-no-files-found: error
          retention-days: 7
