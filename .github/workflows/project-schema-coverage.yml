name: Project structured data coverage guard
on:
  pull_request:
    paths:
      - 'src-greenn/empreendimentos/**/index.html'
      - 'scripts/validate-project-schema-coverage.mjs'
      - '.github/workflows/project-schema-coverage.yml'
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect project coverage and report legacy gaps
        run: node scripts/validate-project-schema-coverage.mjs
