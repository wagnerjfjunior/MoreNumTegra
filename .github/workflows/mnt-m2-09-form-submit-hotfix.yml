name: MNT M2-09 Form Submit Hotfix

on:
  push:
    branches:
      - fix/mnt-m2-09-form-submit-signal
    paths:
      - ".github/workflows/mnt-m2-09-form-submit-hotfix.yml"

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/mnt-m2-09-form-submit-signal

      - name: Apply bounded source corrections
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          measurement = "src-greenn/modules/moretegra.measurement.js"
          lead = "src-greenn/modules/moretegra.lead-journey.js"
          verify = "scripts/verify-moretegra-release.mjs"

          replace_once(measurement,
              "// MNT-M2-09 measurement instrumentation v5.",
              "// MNT-M2-09 measurement instrumentation v6.")
          replace_once(measurement,
              'const BIND_MARKER = Symbol.for("morenumtegra.measurement.delegated.v5");',
              'const BIND_MARKER = Symbol.for("morenumtegra.measurement.delegated.v6");')
          replace_once(measurement,
              '''  function handleFormSubmitAttempt(event) {\n    const form = event.target instanceof HTMLFormElement ? event.target : null;\n    if (!isGreenForm46(form)) return;\n    emitFormStartOnce(form);\n    emit("mnt_form_submit_attempt", "intent", FORM_PARAMETERS);\n  }''',
              '''  function handleFormSubmitAttempt(button) {\n    const form = button?.closest?.(GREEN_FORM_SELECTOR);\n    if (!isGreenForm46(form)) return false;\n    emitFormStartOnce(form);\n    return emit("mnt_form_submit_attempt", "intent", FORM_PARAMETERS);\n  }''')
          replace_once(measurement,
              '''  function handleClick(event) {\n    const element = asElement(event.target);\n    if (!element) return;\n\n    const floating = element.closest("#mt-floating-dock a");''',
              '''  function handleClick(event) {\n    const element = asElement(event.target);\n    if (!element) return;\n\n    const formSubmitButton = element.closest(GREEN_FORM_SUBMIT_SELECTOR);\n    if (formSubmitButton) {\n      handleFormSubmitAttempt(formSubmitButton);\n      return;\n    }\n\n    const floating = element.closest("#mt-floating-dock a");''')
          replace_once(measurement,
              '    document.addEventListener("submit", handleFormSubmitAttempt, true);\n',
              '')

          replace_once(lead,
              "// MNT-M2-09 Form 46 lead guard v3.",
              "// MNT-M2-09 Form 46 lead guard v4.")
          replace_once(lead,
              '    if (!form.checkValidity()) return;\n\n',
              '    // The successful Green redirect to /obrigado is the authoritative second factor.\n    // Do not depend on native HTML submit/validity semantics from the reCAPTCHA-driven Green flow.\n\n')

          replace_once(verify,
              "'// MNT-M2-09 measurement instrumentation v5.'",
              "'// MNT-M2-09 measurement instrumentation v6.'")
          replace_once(verify,
              "'function handleFormSubmitAttempt(event)'",
              "'function handleFormSubmitAttempt(button)'")
          replace_once(verify,
              "'document.addEventListener(\"submit\", handleFormSubmitAttempt, true)'",
              "'const formSubmitButton = element.closest(GREEN_FORM_SUBMIT_SELECTOR);'")
          replace_once(verify,
              "'Symbol.for(\"morenumtegra.measurement.delegated.v5\")'",
              "'Symbol.for(\"morenumtegra.measurement.delegated.v6\")'")
          replace_once(verify,
              "'// MNT-M2-09 Form 46 lead guard v3.'",
              "'// MNT-M2-09 Form 46 lead guard v4.'")
          replace_once(verify,
              "  'if (!form.checkValidity()) return;',\n",
              "  'const form = button.closest(GREEN_FORM_SELECTOR);',\n")
          replace_once(verify,
              '''const forbiddenMeasurement = [\n  "mnt_lead_success",''',
              '''const forbiddenMeasurement = [\n  'document.addEventListener("submit", handleFormSubmitAttempt',\n  "mnt_lead_success",''')
          replace_once(verify,
              '''const forbiddenLeadGuard = [\n  "event_id",''',
              '''const forbiddenLeadGuard = [\n  "checkValidity()",\n  "event_id",''')

      - name: Assemble and verify single Green JavaScript artifact
        run: |
          node scripts/build-moretegra-release.mjs
          node scripts/verify-moretegra-release.mjs
          node --check src-greenn/modules/moretegra.measurement.js
          node --check src-greenn/modules/moretegra.lead-journey.js
          node --check src-greenn/moretegra.js

      - name: Commit corrected sources and release artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-greenn/modules/moretegra.measurement.js \
                  src-greenn/modules/moretegra.lead-journey.js \
                  src-greenn/moretegra.js \
                  scripts/verify-moretegra-release.mjs
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "fix: align Form 46 submit attempt with Green click lifecycle"
          git push origin HEAD:fix/mnt-m2-09-form-submit-signal
