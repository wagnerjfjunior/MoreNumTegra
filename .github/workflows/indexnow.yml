name: IndexNow
on:
  pull_request:
    paths:
      - 'scripts/submit-indexnow.mjs'
      - '.github/workflows/indexnow.yml'
      - 'a49f38b7d2614ce6b9037e528dc16fa0.txt'
  workflow_dispatch:
    inputs:
      urls:
        description: 'URLs separated by whitespace; leave empty for initial production sitemap submission'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: indexnow
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/submit-indexnow.mjs
      - name: Submit only from canonical main
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          INDEXNOW_URLS: ${{ inputs.urls }}
        run: |
          node --input-type=module -e '
          import { spawnSync } from "node:child_process";
          const urls = (process.env.INDEXNOW_URLS || "").trim().split(/\s+/).filter(Boolean);
          const args = ["scripts/submit-indexnow.mjs", ...(urls.length ? ["--urls", ...urls] : ["--sitemap"])];
          const result = spawnSync(process.execPath, args, { stdio: "inherit" });
          process.exit(result.status ?? 1);
          '
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: indexnow-receipt
          path: indexnow-receipt.json
          if-no-files-found: ignore
