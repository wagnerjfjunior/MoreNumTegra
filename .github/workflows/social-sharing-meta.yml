name: Social sharing metadata validation

on:
  pull_request:
    paths:
      - 'src-greenn/preview/index.html'
      - 'src-greenn/empreendimentos/**/index.html'
      - 'scripts/validate-social-sharing-meta.mjs'
      - '.github/workflows/social-sharing-meta.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Open Graph and Twitter metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate social sharing metadata
        run: node scripts/validate-social-sharing-meta.mjs
