name: Assemble Green release

on:
  push:
    branches:
      - feat/mnt-m2-09-tracking-implementation
    paths:
      - "src-greenn/modules/**"
      - "scripts/build-moretegra-release.mjs"
      - ".github/workflows/assemble-green-release.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/mnt-m2-09-tracking-implementation

      - name: Assemble and verify Green JavaScript
        run: |
          node scripts/build-moretegra-release.mjs
          node scripts/verify-moretegra-release.mjs
          node --check src-greenn/moretegra.js

      - name: Commit generated release artifact
        run: |
          if git diff --quiet -- src-greenn/moretegra.js; then
            echo "Release artifact already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-greenn/moretegra.js
          git commit -m "build: assemble Green JS release artifact"
          git push origin HEAD:feat/mnt-m2-09-tracking-implementation
