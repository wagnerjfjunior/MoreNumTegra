name: One-off M4-05R Rich Results correction

on:
  push:
    branches:
      - fix/mnt-m4-05r-rich-results

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mnt-m4-05r-rich-results
          fetch-depth: 0

      - name: Apply consolidated Rich Results patch
        run: python .github/scripts/_oneoff_m4_05r_rich_results.py

      - name: Validate M4-05R contract
        run: node scripts/validate-m4-05r.mjs

      - name: Commit one runtime delta and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/_oneoff-m4-05r-rich-results.yml
          rm .github/scripts/_oneoff_m4_05r_rich_results.py
          git add src-greenn/preview/index.html src-greenn/empreendimentos/capiitolo-piero-lissoni/index.html src-greenn/empreendimentos/caminhos-da-lapa-elo-duo/index.html src-greenn/data/commercial-values.json scripts/validate-m4-05r.mjs .github/workflows/_oneoff-m4-05r-rich-results.yml .github/scripts/_oneoff_m4_05r_rich_results.py
          git commit -m "feat(schema): add factual Google rich-result roots"
          git push origin HEAD:fix/mnt-m4-05r-rich-results
