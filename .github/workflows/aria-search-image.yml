name: Aria approved search image
on:
  pull_request:
    paths:
      - 'src-greenn/empreendimentos/aria-higienopolis/index.html'
      - '.github/workflows/aria-search-image.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Aria primary image and Product/Offer graph
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const html=readFileSync('src-greenn/empreendimentos/aria-higienopolis/index.html','utf8');
          const image='https://s3-gdigital.s3.amazonaws.com/gdigital/313/%C3%81ria%20Higien%C3%B3polis-Perspectiva%20ilustrada%20do%20acesso%20residencial..webp';
          assert(html.includes('<meta property="og:image" content="'+image+'">'));
          assert(html.includes('<meta name="twitter:image" content="'+image+'">'));
          assert(html.includes('<img src="'+image+'"'));
          const doc=JSON.parse(html.match(/<script[^>]*type="application\/ld\+json"[^>]*>([\s\S]*?)<\/script>/)?.[1]??'null');
          const graph=doc['@graph'];
          const page=graph.find(x=>x['@type']==='WebPage');
          const primary=graph.find(x=>x['@type']==='ImageObject');
          const prod=graph.find(x=>x['@type']==='Product');
          const project=graph.find(x=>x['@type']==='ApartmentComplex');
          const offers=graph.filter(x=>x['@type']==='Offer');
          assert(page && primary && prod && project && offers.length>0);
          assert.equal(primary.contentUrl,image);
          assert.equal(page.primaryImageOfPage?.['@id'],primary['@id']);
          assert.equal(prod.image?.['@id'],primary['@id']);
          assert.equal(project.image?.['@id'],primary['@id']);
          assert(!html.includes('robots" content="noindex'));
          console.log('Aria image graph PASS; product/offers preserved:',offers.length);
          NODE
      - name: Freeze all non-image JSON-LD entity contracts
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          const path='src-greenn/empreendimentos/aria-higienopolis/index.html';
          const baseline='9c8bdc74cb83dc9c9566f87d9288daf25f10c051';
          const before=execFileSync('git',['show',baseline+':'+path],{encoding:'utf8'});
          const after=readFileSync(path,'utf8');
          const parse=html=>JSON.parse(html.match(/<script[^>]*type="application\/ld\+json"[^>]*>([\s\S]*?)<\/script>/)?.[1]??'null')['@graph'];
          const oldNodes=parse(before),newNodes=parse(after);
          assert.equal(oldNodes.length,newNodes.length,'Entity count must not change');
          const strip=nodes=>nodes.map(n=>{
            const x=structuredClone(n);
            if(x['@type']==='ImageObject'&&x['@id']==='https://www.moretegra.com.br/empreendimentos/aria-higienopolis/#primary-image'){
              delete x.contentUrl;delete x.caption;
            }
            return x;
          });
          assert.deepEqual(strip(newNodes),strip(oldNodes),'Previously approved non-image JSON-LD content changed');
          const oldTypes=oldNodes.map(x=>x['@type']).sort(),newTypes=newNodes.map(x=>x['@type']).sort();
          assert.deepEqual(newTypes,oldTypes,'Entity types changed');
          console.log('JSONLD_FREEZE_PASS: original entity count/types and all non-image fields preserved');
          NODE
      - name: Verify image real dimensions
        run: |
          curl -fsSL --max-time 20 'https://s3-gdigital.s3.amazonaws.com/gdigital/313/%C3%81ria%20Higien%C3%B3polis-Perspectiva%20ilustrada%20do%20acesso%20residencial..webp' -o /tmp/aria-primary.webp
          file /tmp/aria-primary.webp
          file /tmp/aria-primary.webp | grep -q '1600x853'
