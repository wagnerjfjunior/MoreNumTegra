<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Cenário 7 — Lapa → Ayrton Senna / Condomínio Anastácio</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101d2b;color:#eef4fb}header{padding:13px 16px 8px}h1{margin:0;font-size:clamp(16px,2vw,21px)}header p{color:#b9cbde;font-size:12px;line-height:1.4;margin:6px 0}.legend{margin:5px 12px 8px;padding:12px;border-radius:11px;border:1px solid #405c74;background:#18334b}.legend-title{font-size:14px;font-weight:750;margin:0 0 8px}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.option{display:flex;align-items:center;gap:9px;padding:8px;border-radius:9px;border:1px solid #4e677d;background:#10283b;font-size:12px;line-height:1.35;cursor:pointer;min-height:50px}.option input{width:19px;height:19px;accent-color:#EBB92E;flex:none}.option svg{width:21px;height:37px;flex:none;overflow:visible}.option strong{font-size:12px}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:10px}.actions button{font:700 12px system-ui;min-height:39px;border-radius:8px;padding:8px 14px;cursor:pointer;background:#ebb92e;border:0;color:#182536}.actions button.secondary{border:1px solid #657b90;background:#213c54;color:#edf4fb}.status{color:#b6cadb;font-size:12px}#stage{position:relative;max-width:1448px;margin:auto;line-height:0;overflow:hidden}#map{display:block;width:100%;height:auto}#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.route-line{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.76;stroke-dasharray:10 7}.car-body{stroke:#fff;stroke-width:1.5;filter:drop-shadow(0 2px 3px #0009)}.car-window{fill:#e7f4fb}#error{padding:12px;color:#ffd8aa}.hint{margin:10px 15px;color:#aabfd2;font-size:11px;line-height:1.45}button:focus-visible,input:focus-visible{outline:3px solid #ebb92e;outline-offset:2px}[hidden]{display:none!important}@media(max-width:700px){.options{grid-template-columns:1fr}.option{min-height:44px}.legend{padding:10px}.actions{justify-content:flex-start}}
</style></head>
<body><header><h1>Lapa → Ayrton Senna / Condomínio Anastácio</h1>
</header>
<section class="legend" aria-label="Sentidos do trajeto"><h2 class="legend-title">Sentidos do trajeto</h2><div id="routeControls" class="options"></div>
<div class="actions"><button id="toggle" type="button" aria-pressed="true">Pausar animação</button><button id="restart" class="secondary" type="button">Reiniciar percursos</button><span id="status" class="status" aria-live="polite">Carregando mapa…</span></div></section>
<div id="stage"><img id="map" alt="Mapa ilustrado do Complexo Lapa–Tietê com os acessos de Lapa, Ayrton Senna e condomínios Anastácio" width="1448" height="1086" decoding="async">
<svg id="overlay" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" preserveAspectRatio="xMidYMid meet" aria-label="Três trajetos com veículos animados"></svg></div>
<div id="error" hidden role="alert"></div>
<script>
(()=>{'use strict';
const FILE='Complexo-Lapa-Tietê-Percurso-Completo-v1.png';
const ROUTES=[{"id":"lapa_ayrton","name":"Lapa → Ayrton Senna","color":"#FF5F00","cars":8,"phase":0,"points":[[1437,1048],[1292,988],[1142,927],[1001,864],[936,831],[909,825],[880,825],[860,834],[753,906],[698,940],[662,964],[641,966],[622,945],[606,901],[502,557],[478,482],[476,468],[482,458],[489,448],[495,434],[486,422],[482,408],[474,395],[474,387],[479,379],[489,371],[505,369],[525,371],[701,384],[760,390],[834,395],[902,390],[1115,371],[1282,356],[1428,343]]},{"id":"saida_parques","name":"Saída Parques da Lapa","color":"#D7A44D","cars":5,"phase":0,"points":[[606,897],[589,881],[555,879],[455,881],[405,874],[346,858],[314,845],[281,834],[273,827],[275,817],[278,808],[285,787],[299,752],[315,714],[327,689],[328,663],[327,647],[322,639],[312,631],[270,607],[241,590],[229,563],[236,538],[249,527],[270,519],[281,514],[335,508],[418,498],[445,499],[460,503],[469,506],[476,512],[478,521],[479,529],[478,540],[461,543],[443,547]]},{"id":"lapa_quintas","name":"Lapa → Quintas da Lapa","color":"#FF5F00","cars":5,"phase":0.125,"points":[[610,902],[602,892],[588,884],[570,879],[547,879],[502,882],[429,882],[371,871],[322,855],[285,838],[276,834],[276,821],[276,801],[296,761],[317,702],[325,668],[325,650],[323,634],[333,624],[341,615],[359,602],[387,592],[427,582],[463,571],[492,568],[499,577],[503,602],[510,629],[518,654],[520,673],[508,688],[487,696],[471,697]]}];
const NS='http://www.w3.org/2000/svg',DURATION=28000/1.1;
const $=id=>document.getElementById(id),overlay=$('overlay'),controls=$('routeControls');
let runId=0,epoch=0,pausedAt=0,playing=false,loaded=false;
const create=(tag,a={})=>{const el=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(a))el.setAttribute(k,String(v));return el;};
function carIcon(c){return '<svg viewBox="0 0 20 36" role="img" aria-label="Carro com dois vidros"><rect x="0.5" y="0.5" width="19" height="35" rx="6" fill="'+c+'" stroke="#fff"/><rect x="3" y="7" width="14" height="8" rx="2" fill="#e7f4fb"/><rect x="3" y="23" width="14" height="7" rx="2" fill="#e7f4fb"/></svg>';}
for(const r of ROUTES){
 const label=document.createElement('label');label.className='option';label.innerHTML='<input type="checkbox" checked aria-label="Exibir '+r.name+'">'+carIcon(r.color)+'<strong>'+r.name+'</strong>';controls.append(label);
 r.enabled=true;label.querySelector('input').addEventListener('change',e=>{r.enabled=e.target.checked;r.group.setAttribute('visibility',r.enabled?'visible':'hidden');});
 const d='M '+r.points.map(x=>x.join(' ')).join(' L ');
 r.group=create('g',{'data-route':r.id});r.path=create('path',{d,fill:'none',stroke:'none'});r.group.append(r.path);
 r.group.append(create('path',{d,class:'route-line',stroke:r.color}));
 r.fleet=create('g',{'aria-label':r.name+' — '+r.cars+' carros'});r.vehicles=[];
 for(let i=0;i<r.cars;i++){const v=create('g');v.append(create('rect',{class:'car-body',x:-10,y:-18,width:20,height:36,rx:7,fill:r.color}));v.append(create('rect',{class:'car-window',x:-7,y:-11,width:14,height:8,rx:2}));v.append(create('rect',{class:'car-window',x:-7,y:5,width:14,height:7,rx:2}));r.fleet.append(v);r.vehicles.push(v);}r.group.append(r.fleet);overlay.append(r.group);
 }
function render(now){for(const r of ROUTES){if(!r.enabled)continue;const length=r.length,phase=((now-epoch)/DURATION+r.phase)%1;for(let i=0;i<r.vehicles.length;i++){const dist=length*((phase+i/r.cars)%1),p=r.path.getPointAtLength(dist),a=r.path.getPointAtLength(Math.min(length,dist+3)),b=r.path.getPointAtLength(Math.max(0,dist-3)),deg=Math.atan2(a.y-b.y,a.x-b.x)*180/Math.PI+90;r.vehicles[i].setAttribute('transform','translate('+p.x+' '+p.y+') rotate('+deg+')');}}if(playing)runId=requestAnimationFrame(render);}
function pause(){if(!playing)return;playing=false;cancelAnimationFrame(runId);pausedAt=performance.now();$('toggle').textContent='Reproduzir animação';$('toggle').setAttribute('aria-pressed','false');}
function resume(reset=false){if(!loaded)return;if(playing)cancelAnimationFrame(runId);if(reset||!epoch)epoch=performance.now();else if(pausedAt)epoch+=performance.now()-pausedAt;pausedAt=0;playing=true;$('toggle').textContent='Pausar animação';$('toggle').setAttribute('aria-pressed','true');runId=requestAnimationFrame(render);}
$('toggle').addEventListener('click',()=>playing?pause():resume());$('restart').addEventListener('click',()=>resume(true));
$('map').addEventListener('load',()=>{const image=$('map');if(image.naturalWidth!==1448||image.naturalHeight!==1086){$('error').hidden=false;$('error').textContent='Não foi possível mostrar os trajetos.';return;}for(const r of ROUTES)r.length=r.path.getTotalLength();loaded=true;$('status').textContent='Percursos prontos';if(matchMedia('(prefers-reduced-motion: reduce)').matches){$('toggle').textContent='Reproduzir animação';$('toggle').setAttribute('aria-pressed','false');}else resume(true);});
$('map').addEventListener('error',()=>{$('error').hidden=false;$('error').textContent='Mapa indisponível neste momento.';});
$('map').src='/src-greenn/complexo-lapa-pirituba/assets/'+encodeURIComponent(FILE);
})();
</script></body></html>
